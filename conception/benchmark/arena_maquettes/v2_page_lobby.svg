<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Croquis maison BM-ARENA (17/10/2026) : page du Colisée dans le menu Jouer (format, difficulté, classe, alliés proposés).
       DA « autocollant manga » (BIBLE v2) ; même cadre que les pages d'activité actuelles (panneau papier, image du jeu en tête).
       Aucun élément tiers ; « image » = vue du jeu à poser, « icône » = icône de classe du jeu. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; }
      .tp { fill: #FFF8EC; font-size: 15px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .b { font-weight: 800; }
      .s { font-size: 15px; }
      .note { fill: #C21E43; font-size: 14px; font-weight: 700; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.18"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#CCDEF3"/>
  <path d="M0 600 C 400 520, 900 640, 1600 560 L1600 900 L0 900 Z" fill="#ACB47F"/>
  <!-- colonne de menu existante (schématique) -->
  <g transform="translate(46,200)" stroke="#221A3A" stroke-width="3">
    <rect width="296" height="56" rx="14" fill="#22B8F0"/><rect y="72" width="296" height="56" rx="14" fill="#FFF8EC"/>
    <rect y="144" width="296" height="56" rx="14" fill="#FFF8EC"/><rect y="216" width="296" height="56" rx="14" fill="#FFF8EC"/>
  </g>
  <text x="80" y="236" class="tw" font-size="20">Jouer</text>

  <!-- page de l'activité -->
  <g transform="translate(372,190)">
    <rect x="7" y="7" width="600" height="690" rx="18" fill="#221A3A"/>
    <rect width="600" height="690" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <!-- image du jeu + voile -->
    <rect x="16" y="16" width="568" height="120" rx="16" fill="#CEBFA7" stroke="#221A3A" stroke-width="3"/>
    <text x="300" y="70" text-anchor="middle" class="t s">image : vue de l'arène du jeu</text>
    <rect x="16" y="86" width="568" height="50" rx="0" fill="#221A3A" opacity="0.55"/>
    <text x="36" y="122" class="tw pop" font-size="30">Le Colisée</text>
    <g transform="translate(420,98) rotate(-4)"><rect width="140" height="30" rx="10" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="70" y="21" text-anchor="middle" class="tw" font-size="14">6 trios · 1 couronne</text></g>
    <text x="20" y="166" class="t s">Donne</text>
    <g transform="translate(76,150)" stroke="#221A3A" stroke-width="3"><rect width="24" height="24" rx="6" fill="#B43BEB"/><rect x="120" width="24" height="24" rx="6" fill="#FFC928"/></g>
    <text x="108" y="168" class="t s">Apparences</text><text x="228" y="168" class="t s">Titres</text>
    <text x="300" y="168" class="s" fill="#6B5E86">· partie scellée : rien du compte</text>

    <text x="20" y="208" class="t b">Format</text>
    <g transform="translate(20,218)">
      <g><rect width="180" height="78" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="90" y="34" text-anchor="middle" class="tw" font-size="19">Classique</text><text x="90" y="60" text-anchor="middle" class="tw" font-size="14">6 trios · 19 min</text></g>
      <g transform="translate(190,0)"><rect width="180" height="78" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><text x="90" y="34" text-anchor="middle" class="t b">Éclair</text><text x="90" y="60" text-anchor="middle" class="t s">4 trios · 14 min</text></g>
      <g transform="translate(380,0)"><rect width="180" height="78" rx="14" fill="url(#trame)" stroke="#6B5E86" stroke-width="3"/><text x="90" y="34" text-anchor="middle" fill="#6F6787" class="b">Grand tournoi</text><text x="90" y="60" text-anchor="middle" fill="#6F6787" class="s">8 trios · bientôt</text>
        <circle cx="160" cy="16" r="11" fill="#6B5E86" stroke="#221A3A" stroke-width="2"/></g>
    </g>

    <text x="20" y="330" class="t b">Adversaires</text>
    <g transform="translate(20,340)" stroke="#221A3A" stroke-width="3">
      <rect width="104" height="44" rx="12" fill="#FFF8EC"/><rect x="112" width="104" height="44" rx="12" fill="#FFF8EC"/>
      <rect x="224" width="104" height="44" rx="12" fill="#22B8F0"/><rect x="336" width="104" height="44" rx="12" fill="#FFF8EC"/><rect x="448" width="112" height="44" rx="12" fill="#FFF8EC"/>
    </g>
    <text x="72" y="368" text-anchor="middle" class="t s b">Facile</text><text x="184" y="368" text-anchor="middle" class="t s b">Normal</text>
    <text x="296" y="368" text-anchor="middle" class="tw s">Difficile</text><text x="408" y="368" text-anchor="middle" class="t s b">Hardcore</text><text x="524" y="368" text-anchor="middle" class="t s b">Mélange</text>

    <text x="20" y="420" class="t b">Ton héros</text>
    <g transform="translate(20,430)"><rect width="560" height="64" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
      <rect x="8" y="8" width="48" height="48" rx="12" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
      <text x="68" y="30" class="tp b">Magicien · Arcane</text><text x="68" y="50" class="tp" opacity="0.8">sorts : préréglage « Duel »</text>
      <g transform="translate(420,12)"><rect width="128" height="40" rx="12" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><text x="64" y="26" text-anchor="middle" class="t s b">Changer</text></g></g>

    <text x="20" y="526" class="t b">Tes alliés</text>
    <g transform="translate(20,536)">
      <g><rect width="180" height="64" rx="14" fill="#86DDFF" stroke="#221A3A" stroke-width="3"/>
        <g transform="translate(12,10)" stroke="#221A3A" stroke-width="2"><rect width="40" height="40" rx="10" fill="#FFC928"/><rect x="46" width="40" height="40" rx="10" fill="#22B8F0"/></g>
        <text x="104" y="30" class="t s b" font-size="14">Rempart</text><text x="104" y="50" class="t s" font-size="14">Ferveur</text></g>
      <g transform="translate(190,0)"><rect width="180" height="64" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
        <g transform="translate(12,10)" stroke="#221A3A" stroke-width="2"><rect width="40" height="40" rx="10" fill="#8FD62E"/><rect x="46" width="40" height="40" rx="10" fill="#FFC928"/></g>
        <text x="104" y="30" class="t s b" font-size="14">Traque</text><text x="104" y="50" class="t s" font-size="14">Rempart</text></g>
      <g transform="translate(380,0)"><rect width="180" height="64" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><text x="90" y="38" text-anchor="middle" class="t b">Au hasard</text></g>
    </g>

    <g transform="translate(20,612)">
      <rect y="5" width="560" height="64" rx="14" fill="#221A3A"/>
      <rect width="560" height="64" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
      <rect x="12" y="6" width="16" height="6" rx="3" fill="#fff" transform="rotate(-12 20 9)"/>
      <text x="280" y="43" text-anchor="middle" class="tw pop" font-size="26">Entrer au Colisée</text>
    </g>
  </g>

  <!-- héros du joueur à droite (comme le menu actuel) -->
  <circle cx="1220" cy="560" r="90" fill="#22B8F0" stroke="#221A3A" stroke-width="4"/>
  <text x="1220" y="568" text-anchor="middle" class="tw" font-size="18">ton héros</text>
  <text x="1010" y="250" class="note">Trios proposés : familles complémentaires</text>
  <text x="1010" y="268" class="note">(Duel.team_classes) ; survol = classes et rôles.</text>
  <text x="1010" y="300" class="note">Grand tournoi verrouillé tant que la sonde</text>
  <text x="1010" y="318" class="note">de performances (lot CO-C) n'est pas passée.</text>
  <text x="1010" y="350" class="note">Durées affichées = médianes mesurées (CO-I).</text>
</svg>
