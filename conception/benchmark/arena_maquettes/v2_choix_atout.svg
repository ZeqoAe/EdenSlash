<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Croquis maison BM-ARENA (17/10/2026) : Colisée v2, choix d'atout (manche 4, rareté Or pour les trois cartes).
       DA « autocollant manga » (BIBLE v2). Aucun élément tiers ; « icône » = emplacement d'une icône de passif du jeu (Boons.ICONS). -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 19px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 5; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .b { font-weight: 800; }
      .s { font-size: 15px; }
      .note { fill: #C21E43; font-size: 14px; font-weight: 700; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.18"/></pattern>
    <filter id="flou"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- scène floutée derrière (comme la pause et le choix de carte, lot UIK2) -->
  <g filter="url(#flou)"><rect width="1600" height="900" fill="#ACB47F"/><ellipse cx="800" cy="560" rx="560" ry="220" fill="#CEBFA7"/></g>
  <rect width="1600" height="900" fill="#221A3A" opacity="0.25"/>

  <g transform="translate(560,70) rotate(-3)"><text class="tw pop" font-size="40" stroke-width="7">Choisis un atout</text></g>
  <text x="800" y="150" text-anchor="middle" class="t b">Manche 4 · rareté Or · les trois cartes ont la même rareté</text>

  <!-- trois cartes 320 × 420 ; la 2e est survolée (monte, détail chiffré en bas) -->
  <g transform="translate(250,200)">
    <rect y="7" x="7" width="320" height="420" rx="20" fill="#221A3A"/>
    <rect width="320" height="420" rx="20" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect width="320" height="70" rx="20" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="160" y="46" text-anchor="middle" class="tw" font-size="19">Or · Équipe</text>
    <rect x="110" y="94" width="100" height="100" rx="22" fill="#FFE27A" stroke="#221A3A" stroke-width="3"/><text x="160" y="150" text-anchor="middle" class="t s">icône</text>
    <text x="160" y="236" text-anchor="middle" class="pop t" font-size="26">Serment</text>
    <text x="160" y="276" text-anchor="middle" class="t">Quand un allié tombe,</text>
    <text x="160" y="302" text-anchor="middle" class="t">tu gagnes un bouclier.</text>
    <g transform="translate(20,350)"><rect width="280" height="46" rx="12" fill="#2E2450"/><text x="140" y="30" text-anchor="middle" fill="#FFF8EC" class="s">Va bien avec : Rempart, Ferveur</text></g>
  </g>
  <g transform="translate(640,170)">
    <rect y="10" x="7" width="320" height="460" rx="20" fill="#221A3A"/>
    <rect width="320" height="460" rx="20" fill="#FFF8EC" stroke="#0B7DB5" stroke-width="5"/>
    <rect x="-6" y="-6" width="332" height="472" rx="24" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <rect width="320" height="70" rx="20" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="160" y="46" text-anchor="middle" class="tw" font-size="19">Or · Sorts</text>
    <rect x="110" y="94" width="100" height="100" rx="22" fill="#FFE27A" stroke="#221A3A" stroke-width="3"/><text x="160" y="150" text-anchor="middle" class="t s">icône</text>
    <text x="160" y="236" text-anchor="middle" class="pop t" font-size="26">Écho</text>
    <text x="160" y="276" text-anchor="middle" class="t">Ton sort le plus long</text>
    <text x="160" y="302" text-anchor="middle" class="t">part deux fois.</text>
    <g transform="translate(20,330)"><rect width="280" height="110" rx="12" fill="#2E2450"/>
      <text x="16" y="30" fill="#FFF8EC" class="s b">Détail</text>
      <text x="16" y="56" fill="#FFF8EC" class="s">2e lancer 0,6 s après,</text>
      <text x="16" y="78" fill="#FFF8EC" class="s">à 50 % de sa force ;</text>
      <text x="16" y="100" fill="#FFF8EC" class="s">sorts de recharge ≥ 10 s.</text></g>
  </g>
  <g transform="translate(1030,200)">
    <rect y="7" x="7" width="320" height="420" rx="20" fill="#221A3A"/>
    <rect width="320" height="420" rx="20" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect width="320" height="70" rx="20" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="160" y="46" text-anchor="middle" class="tw" font-size="19">Or · Recette 1/3</text>
    <rect x="110" y="94" width="100" height="100" rx="22" fill="#FFE27A" stroke="#221A3A" stroke-width="3"/><text x="160" y="150" text-anchor="middle" class="t s">icône</text>
    <text x="160" y="236" text-anchor="middle" class="pop t" font-size="26">Braise</text>
    <text x="160" y="276" text-anchor="middle" class="t">Tes coups brûlent.</text>
    <text x="160" y="302" text-anchor="middle" class="t">Réunis Braise, Givre, Foudre…</text>
    <g transform="translate(20,350)" stroke="#221A3A" stroke-width="3">
      <rect width="40" height="40" rx="10" fill="#FF8A1F"/><rect x="52" width="40" height="40" rx="10" fill="url(#trame)" stroke="#6B5E86"/><rect x="104" width="40" height="40" rx="10" fill="url(#trame)" stroke="#6B5E86"/>
      <text x="160" y="27" stroke="none" class="t s">→ Tempête</text>
    </g>
  </g>

  <!-- boutons sous les cartes -->
  <g transform="translate(560,690)">
    <rect y="5" width="220" height="52" rx="14" fill="#221A3A"/><rect width="220" height="52" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <circle cx="30" cy="26" r="13" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="30" y="31" text-anchor="middle" class="tw" font-size="13" stroke-width="3">X</text>
    <text x="124" y="34" text-anchor="middle" class="tw" font-size="19" stroke-width="4">Relancer · 2</text>
  </g>
  <g transform="translate(820,690)">
    <rect y="5" width="220" height="52" rx="14" fill="#221A3A"/><rect width="220" height="52" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <circle cx="30" cy="26" r="13" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="30" y="31" text-anchor="middle" class="tw" font-size="13" stroke-width="3">Y</text>
    <text x="124" y="34" text-anchor="middle" class="t b">Voir mon trio</text>
  </g>
  <!-- choix des alliés IA, visibles -->
  <g transform="translate(470,780)">
    <rect width="660" height="70" rx="16" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="14" y="11" width="48" height="48" rx="12" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="74" y="32" class="t s b">Chevalier a pris « Rempart vivant »</text>
    <text x="74" y="54" class="t s">Clerc hésite entre « Source » et « Serment »</text>
    <g transform="translate(480,14)"><rect width="164" height="42" rx="12" fill="#E9DFCB" stroke="#221A3A" stroke-width="3"/><text x="82" y="27" text-anchor="middle" class="t s b">Lui conseiller…</text></g>
  </g>
  <text x="40" y="660" class="note">Une phrase par carte, sans chiffre ;</text>
  <text x="40" y="678" class="note">le détail chiffré n'apparaît qu'au survol.</text>
  <text x="40" y="706" class="note">Relance d'UNE carte (3 par partie).</text>
  <text x="40" y="734" class="note">Pas de minuteur propre : celui</text>
  <text x="40" y="752" class="note">de la préparation (au pire : au hasard).</text>
  <text x="1170" y="740" class="note">« Lui conseiller » : P2 (Q4).</text>
</svg>
