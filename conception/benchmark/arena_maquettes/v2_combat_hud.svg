<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Croquis maison BM-ARENA (17/10/2026) : Colisée v2, HUD de combat (3 contre 3, anneau de feu qui se resserre, relève).
       DA « autocollant manga » (BIBLE v2). Aucun élément tiers ; les carrés marqués « icône » attendent les icônes du jeu. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; }
      .tp { fill: #FFF8EC; font-size: 15px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .b { font-weight: 800; }
      .s { font-size: 15px; }
      .num { font-weight: 900; font-variant-numeric: tabular-nums; }
      .note { fill: #C21E43; font-size: 14px; font-weight: 700; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.18"/></pattern>
    <radialGradient id="feu" cx="50%" cy="50%" r="50%"><stop offset="70%" stop-color="#FF8A1F" stop-opacity="0"/><stop offset="100%" stop-color="#FF8A1F" stop-opacity="0.45"/></radialGradient>
  </defs>

  <!-- arène vue de dessus inclinée -->
  <rect width="1600" height="900" fill="#ACB47F"/>
  <ellipse cx="800" cy="500" rx="700" ry="380" fill="#CEBFA7"/>
  <!-- feu hors de l'anneau (bord orange, intérieur ≤ 35 %) -->
  <ellipse cx="800" cy="500" rx="700" ry="380" fill="url(#feu)"/>
  <ellipse cx="800" cy="500" rx="470" ry="255" fill="none" stroke="#FFF8EC" stroke-width="3"/>
  <ellipse cx="800" cy="500" rx="470" ry="255" fill="none" stroke="#FF8A1F" stroke-width="6" stroke-dasharray="22 10"/>
  <!-- prochain anneau en pointillés fins -->
  <ellipse cx="800" cy="500" rx="330" ry="180" fill="none" stroke="#221A3A" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <g fill="#E9DFCB" stroke="#221A3A" stroke-width="3">
    <rect x="560" y="390" width="36" height="72" rx="8"/><rect x="1004" y="390" width="36" height="72" rx="8"/>
    <rect x="690" y="600" width="36" height="72" rx="8"/><rect x="874" y="600" width="36" height="72" rx="8"/>
  </g>
  <!-- héros : alliés (liseré pomme), ennemis (liseré fraise) ; barres courtes, aucun nom -->
  <g stroke="#221A3A" stroke-width="3">
    <circle cx="700" cy="520" r="22" fill="#22B8F0"/><circle cx="640" cy="470" r="22" fill="#FFC928"/>
    <circle cx="930" cy="470" r="22" fill="#FF4D6D"/><circle cx="980" cy="540" r="22" fill="#FF4D6D"/><circle cx="890" cy="420" r="22" fill="#FF4D6D"/>
  </g>
  <g>
    <rect x="672" y="484" width="56" height="10" rx="5" fill="#2E2450" stroke="#221A3A" stroke-width="2"/><rect x="674" y="486" width="40" height="6" rx="3" fill="#8FD62E"/>
    <rect x="612" y="434" width="56" height="10" rx="5" fill="#2E2450" stroke="#221A3A" stroke-width="2"/><rect x="614" y="436" width="50" height="6" rx="3" fill="#8FD62E"/>
    <rect x="902" y="434" width="56" height="10" rx="5" fill="#2E2450" stroke="#221A3A" stroke-width="2"/><rect x="904" y="436" width="20" height="6" rx="3" fill="#FF4D6D"/>
    <rect x="952" y="504" width="56" height="10" rx="5" fill="#2E2450" stroke="#221A3A" stroke-width="2"/><rect x="954" y="506" width="44" height="6" rx="3" fill="#FF4D6D"/>
    <rect x="862" y="384" width="56" height="10" rx="5" fill="#2E2450" stroke="#221A3A" stroke-width="2"/><rect x="864" y="386" width="30" height="6" rx="3" fill="#FF4D6D"/>
  </g>
  <!-- allié à terre + cercle de relève (se remplit) -->
  <circle cx="760" cy="600" r="44" fill="#8FD62E" fill-opacity="0.2" stroke="#4F8F10" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M760 556 A44 44 0 0 1 804 600" fill="none" stroke="#8FD62E" stroke-width="8"/>
  <circle cx="760" cy="600" r="18" fill="#B9B2C9" stroke="#221A3A" stroke-width="3"/>
  <g transform="translate(700,650) rotate(-3)"><rect width="124" height="30" rx="12" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/><text x="62" y="21" text-anchor="middle" class="tw" font-size="15">Relève · 2 s</text></g>
  <!-- télégraphe ennemi -->
  <circle cx="680" cy="500" r="54" fill="#FF4D6D" fill-opacity="0.3" stroke="#FFF8EC" stroke-width="2"/>

  <!-- HAUT : barres d'équipe (toi à gauche, adversaire à droite), chrono, feu -->
  <g transform="translate(400,16)">
    <rect width="800" height="78" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <!-- toi -->
    <circle cx="36" cy="39" r="20" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="36" y="45" text-anchor="middle" class="tw" font-size="15">★</text>
    <g transform="translate(66,16)" stroke="#221A3A" stroke-width="3">
      <rect width="88" height="46" rx="10" fill="#22B8F0"/><rect x="96" width="88" height="46" rx="10" fill="#FFC928"/><rect x="192" width="88" height="46" rx="10" fill="url(#trame)" stroke="#6B5E86"/>
    </g>
    <g transform="translate(70,48)"><rect width="80" height="10" rx="5" fill="#2E2450"/><rect width="58" height="10" rx="5" fill="#8FD62E"/>
      <rect x="96" width="80" height="10" rx="5" fill="#2E2450"/><rect x="96" width="72" height="10" rx="5" fill="#8FD62E"/></g>
    <text x="300" y="58" class="t s" fill="#6B5E86">relève</text>
    <!-- centre -->
    <text x="400" y="38" text-anchor="middle" class="num" font-size="30" fill="#221A3A">0:41</text>
    <g transform="translate(345,46)"><rect width="110" height="24" rx="10" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="55" y="17" text-anchor="middle" class="tw" font-size="13">Feu · 4 s</text></g>
    <!-- adversaire -->
    <g transform="translate(470,16)" stroke="#221A3A" stroke-width="3">
      <rect width="88" height="46" rx="10" fill="#FF9DB0"/><rect x="96" width="88" height="46" rx="10" fill="#FF9DB0"/><rect x="192" width="88" height="46" rx="10" fill="#FF9DB0"/>
    </g>
    <g transform="translate(474,48)"><rect width="80" height="10" rx="5" fill="#2E2450"/><rect width="28" height="10" rx="5" fill="#FF4D6D"/>
      <rect x="96" width="80" height="10" rx="5" fill="#2E2450"/><rect x="96" width="62" height="10" rx="5" fill="#FF4D6D"/>
      <rect x="192" width="80" height="10" rx="5" fill="#2E2450"/><rect x="192" width="40" height="10" rx="5" fill="#FF4D6D"/></g>
    <circle cx="772" cy="39" r="20" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
  </g>

  <!-- DROITE : vignettes des autres combats (cliquer = regarder) -->
  <g transform="translate(1366,120)">
    <text x="0" y="0" class="t b pop" font-size="16">Ailleurs</text>
    <g transform="translate(0,12)">
      <rect width="216" height="58" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
      <circle cx="26" cy="29" r="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="108" y="35" text-anchor="middle" class="t num b">2 – 1</text>
      <circle cx="190" cy="29" r="14" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/>
    </g>
    <g transform="translate(0,78)">
      <rect width="216" height="58" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
      <circle cx="26" cy="29" r="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/><text x="108" y="35" text-anchor="middle" class="t b s">✔ Améthystes</text>
      <circle cx="190" cy="29" r="14" fill="#B9B2C9" stroke="#6B5E86" stroke-width="3"/>
    </g>
  </g>

  <!-- GAUCHE : atouts tenus (6 cases au plus) -->
  <g transform="translate(18,120)">
    <text x="0" y="0" class="t b pop" font-size="16">Atouts</text>
    <g transform="translate(0,12)" stroke="#221A3A" stroke-width="3">
      <rect width="48" height="48" rx="12" fill="#C9BFEA"/><rect x="56" width="48" height="48" rx="12" fill="#FFC928"/>
      <rect y="56" width="48" height="48" rx="12" fill="url(#trame)" stroke="#6B5E86"/><rect x="56" y="56" width="48" height="48" rx="12" fill="url(#trame)" stroke="#6B5E86"/>
    </g>
  </g>

  <!-- BAS : barre de sorts existante (6 cases), PV, esquive -->
  <g transform="translate(540,790)">
    <rect width="520" height="92" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="16" y="12" width="488" height="16" rx="8" fill="#2E2450" stroke="#221A3A" stroke-width="2"/><rect x="18" y="14" width="350" height="12" rx="6" fill="#8FD62E"/>
    <g transform="translate(16,36)" stroke="#221A3A" stroke-width="3">
      <rect width="46" height="46" rx="10" fill="#22B8F0"/><rect x="54" width="46" height="46" rx="10" fill="#22B8F0"/><rect x="108" width="46" height="46" rx="10" fill="#22B8F0"/>
      <rect x="162" width="46" height="46" rx="10" fill="#22B8F0" opacity="0.5"/><rect x="216" width="46" height="46" rx="10" fill="#FFB566"/><rect x="270" width="46" height="46" rx="10" fill="url(#trame)" stroke="#6B5E86"/>
      <circle cx="440" cy="23" r="23" fill="#FFF8EC"/>
    </g>
    <text x="456" y="64" text-anchor="middle" class="t b s">esq.</text>
  </g>

  <!-- annonce manga (événement seulement) -->
  <g transform="translate(980,250) rotate(-4)"><text class="tw pop" font-size="34">Double K.O. !</text></g>

  <text x="40" y="320" class="note">Barres courtes, pomme = toi et tes alliés, fraise = adversaires ;</text>
  <text x="40" y="338" class="note">aucun nom au-dessus des héros (survol : bulle).</text>
  <text x="1120" y="300" class="note">Les autres combats sont joués pour de vrai,</text>
  <text x="1120" y="318" class="note">sans rendu ; clic sur une vignette = les regarder.</text>
  <text x="40" y="760" class="note">Anneau : blanc net + orange ; le prochain en pointillés ; « Feu · 4 s » avant chaque resserrement.</text>
</svg>
