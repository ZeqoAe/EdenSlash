<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Croquis maison BM-ARENA (17/10/2026) : Colisée v2, fin de partie (2e place sur 6 = victoire : moitié haute).
       Composant commun ResultsPanel (lot UIK2) habillé ; DA « autocollant manga » (BIBLE v2). Aucun élément tiers. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; }
      .tp { fill: #FFF8EC; font-size: 15px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 5; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .b { font-weight: 800; }
      .s { font-size: 15px; }
      .num { font-weight: 900; font-variant-numeric: tabular-nums; }
      .note { fill: #C21E43; font-size: 14px; font-weight: 700; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.18"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#CCDEF3"/>
  <!-- rayons derrière la place -->
  <g transform="translate(800,110)" fill="#FFE27A" opacity="0.55">
    <path d="M0 0 L-40 -160 L40 -160 Z"/><path d="M0 0 L120 -110 L160 -50 Z"/><path d="M0 0 L-120 -110 L-160 -50 Z"/>
    <path d="M0 0 L190 30 L170 90 Z"/><path d="M0 0 L-190 30 L-170 90 Z"/>
  </g>
  <rect x="80" y="40" width="1440" height="820" rx="22" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <g transform="translate(800,128) rotate(-3)"><text text-anchor="middle" class="tw pop" font-size="56" stroke-width="9">2e · Victoire !</text></g>
  <text x="800" y="178" text-anchor="middle" class="t b">Colisée · Classique · Difficile · 11 manches · 18 min 40</text>

  <!-- podium des 6 équipes -->
  <g transform="translate(140,210)">
    <text x="0" y="0" class="t b pop" font-size="20">Classement</text>
    <g transform="translate(0,16)">
      <g><rect width="420" height="52" rx="12" fill="#2E2450"/><text x="18" y="34" class="tp num b" font-size="22">1</text>
        <circle cx="62" cy="26" r="15" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="88" y="32" class="tp b">Lagons</text>
        <g transform="translate(250,10)" stroke="#221A3A" stroke-width="2"><rect width="32" height="32" rx="8" fill="#B43BEB"/><rect x="38" width="32" height="32" rx="8" fill="#FF8A1F"/><rect x="76" width="32" height="32" rx="8" fill="#22B8F0"/></g></g>
      <g transform="translate(0,60)"><rect width="420" height="52" rx="12" fill="#FFE27A" stroke="#221A3A" stroke-width="3"/><text x="18" y="34" class="t num b" font-size="22">2</text>
        <circle cx="62" cy="26" r="15" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="88" y="32" class="t b">Toi · Soleils</text>
        <g transform="translate(250,10)" stroke="#221A3A" stroke-width="2"><rect width="32" height="32" rx="8" fill="#22B8F0"/><rect x="38" width="32" height="32" rx="8" fill="#FFC928"/><rect x="76" width="32" height="32" rx="8" fill="#22B8F0"/></g></g>
      <g transform="translate(0,120)"><rect width="420" height="52" rx="12" fill="#2E2450"/><text x="18" y="34" class="tp num b" font-size="22">3</text>
        <circle cx="62" cy="26" r="15" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/><text x="88" y="32" class="tp b">Améthystes</text></g>
      <g transform="translate(0,180)"><rect width="420" height="44" rx="12" fill="#2E2450" opacity="0.8"/><text x="18" y="30" class="tp num">4 · Fraises</text></g>
      <g transform="translate(0,230)"><rect width="420" height="44" rx="12" fill="#2E2450" opacity="0.8"/><text x="18" y="30" class="tp num">5 · Pommes</text></g>
      <g transform="translate(0,280)"><rect width="420" height="44" rx="12" fill="#2E2450" opacity="0.8"/><text x="18" y="30" class="tp num">6 · Mandarines</text></g>
    </g>
  </g>

  <!-- ton trio final : héros, atouts, pièces -->
  <g transform="translate(610,210)">
    <text x="0" y="0" class="t b pop" font-size="20">Ton trio</text>
    <g transform="translate(0,16)">
      <rect width="400" height="96" rx="14" fill="#2E2450"/>
      <rect x="10" y="10" width="76" height="76" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
      <text x="100" y="34" class="tp b">Magicien · toi</text>
      <g transform="translate(100,46)" stroke="#221A3A" stroke-width="2"><rect width="34" height="34" rx="8" fill="#C9BFEA"/><rect x="40" width="34" height="34" rx="8" fill="#FFC928"/><rect x="80" width="34" height="34" rx="8" fill="#FFC928"/><rect x="120" width="34" height="34" rx="8" fill="#DC92FF"/></g>
      <g transform="translate(0,106)"><rect width="400" height="64" rx="14" fill="#2E2450"/><rect x="10" y="8" width="48" height="48" rx="12" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="72" y="38" class="tp b">Chevalier · MVP de la manche 9</text></g>
      <g transform="translate(0,180)"><rect width="400" height="64" rx="14" fill="#2E2450"/><rect x="10" y="8" width="48" height="48" rx="12" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="72" y="38" class="tp b">Clerc · 2 relèves · 9 800 PV soignés</text></g>
    </g>
  </g>

  <!-- tuiles -->
  <g transform="translate(1050,210)">
    <text x="0" y="0" class="t b pop" font-size="20">Ta partie</text>
    <g transform="translate(0,16)" font-size="15">
      <rect width="190" height="80" rx="14" fill="#2E2450"/><text x="16" y="30" class="tp">Manches</text><text x="16" y="62" class="tp num b" font-size="26">7 – 4</text>
      <rect x="200" width="190" height="80" rx="14" fill="#2E2450"/><text x="216" y="30" class="tp">K.O.</text><text x="216" y="62" class="tp num b" font-size="26">14</text>
      <rect y="90" width="190" height="80" rx="14" fill="#2E2450"/><text x="16" y="120" class="tp">Meilleur atout</text><text x="16" y="150" class="tp b">Écho</text>
      <rect x="200" y="90" width="190" height="80" rx="14" fill="#2E2450"/><text x="216" y="120" class="tp">Battus par</text><text x="216" y="150" class="tp b">Lagons (×3)</text>
    </g>
  </g>

  <!-- récompenses : coffres d'apparence révélés un à un, titre -->
  <g transform="translate(610,640)">
    <text x="0" y="0" class="t b pop" font-size="20">Gagné</text>
    <g transform="translate(0,16)">
      <rect width="120" height="110" rx="16" fill="#86DDFF" stroke="#221A3A" stroke-width="3"/><text x="60" y="96" text-anchor="middle" class="t s b">Coffre rare</text>
      <rect x="134" width="120" height="110" rx="16" fill="url(#trame)" stroke="#221A3A" stroke-width="3"/><text x="194" y="60" text-anchor="middle" class="t s">?</text>
      <g transform="translate(272,20) rotate(-4)"><rect width="250" height="56" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="125" y="36" text-anchor="middle" class="tw" font-size="19" stroke-width="4">Titre : Gladiateur</text></g>
    </g>
  </g>
  <!-- boutons -->
  <g transform="translate(1110,760)">
    <rect y="5" width="200" height="64" rx="14" fill="#221A3A"/><rect width="200" height="64" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="100" y="42" text-anchor="middle" class="tw pop" font-size="26" stroke-width="5">Rejouer</text>
  </g>
  <g transform="translate(1324,766)"><rect y="5" width="170" height="52" rx="14" fill="#221A3A"/><rect width="170" height="52" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><text x="85" y="33" text-anchor="middle" class="t b">Menu principal</text></g>
  <g transform="translate(140,790)"><rect y="5" width="200" height="52" rx="14" fill="#221A3A"/><rect width="200" height="52" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><text x="100" y="33" text-anchor="middle" class="t b">Manche par manche</text></g>
  <text x="140" y="770" class="note">Moitié haute (1re à 3e sur 6) = « Victoire » ; 1re = confettis.</text>
  <text x="1050" y="430" class="note">« Battus par » : ce qui t'a battu, comme la Survie.</text>
</svg>
