<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Maquette maison BM-TAC (17/10/2026) : en haut, le bandeau de fin de manche (non bloquant, 5 s) ; en dessous, le bilan de fin de partie
       de l'Assaut (tableau des 8 héros, frise des manches, récompenses scellées). DA « autocollant manga » (BIBLE v2). Aucun élément tiers. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-weight: 700; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 900; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .note { fill: #C21E45; font-size: 14px; font-weight: 800; }
      .c { font-size: 15px; font-weight: 800; fill: #FFF8EC; text-anchor: middle; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.25"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#E9DFCB"/>
  <rect width="1600" height="900" fill="url(#trame)"/>
  <!-- rayons derrière la victoire -->
  <g transform="translate(800 120)" fill="#FFE27A" opacity="0.6">
    <path d="M0 0 L-60 -140 L60 -140 Z"/><path d="M0 0 L160 -90 L200 -10 Z" /><path d="M0 0 L-160 -90 L-200 -10 Z"/>
  </g>

  <!-- A. bandeau de fin de manche (exemple, posé ici pour la maquette) -->
  <g transform="translate(40 24)">
    <g transform="rotate(-3 270 40)"><rect x="6" y="6" width="540" height="78" rx="18" fill="#221A3A"/>
      <rect width="540" height="78" rx="18" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
      <text x="24" y="38" class="tw pop" font-size="26">Manche gagnée !</text>
      <text x="24" y="64" class="tw" font-size="16">Charge désamorcée · Élouan à 0,4 s</text></g>
    <g transform="translate(0 100)" font-size="14" font-weight="800">
      <rect width="540" height="44" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
      <text x="16" y="28" fill="#221A3A">Or : victoire +2 400 · éliminations +400 · total 4 250</text>
      <rect x="430" y="8" width="100" height="28" rx="10" fill="#FFC928" stroke="#221A3A" stroke-width="2.5"/><text x="480" y="27" text-anchor="middle" class="tw" font-size="13">Détail</text>
    </g>
  </g>
  <text x="600" y="60" class="note">← bandeau 5 s, puis l'achat s'ouvre ; rien n'attend de clic</text>

  <!-- B. bilan de fin de partie -->
  <g transform="translate(40 190)">
    <rect x="8" y="8" width="1520" height="660" rx="22" fill="#221A3A"/>
    <rect width="1520" height="660" rx="22" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <g transform="translate(560 -38) rotate(-3)"><rect x="6" y="6" width="400" height="84" rx="20" fill="#221A3A"/>
      <rect width="400" height="84" rx="20" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
      <text x="200" y="58" text-anchor="middle" class="tw pop" font-size="42">Victoire !</text></g>
    <!-- score -->
    <g transform="translate(560 66)">
      <rect width="120" height="76" rx="16" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="60" y="54" text-anchor="middle" class="tw pop" font-size="44">7</text>
      <text x="200" y="52" text-anchor="middle" class="pop" font-size="30" fill="#221A3A">contre</text>
      <rect x="280" width="120" height="76" rx="16" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/><text x="340" y="54" text-anchor="middle" class="tw pop" font-size="44">4</text>
    </g>
    <!-- frise des manches : couleur = gagnant, symbole = façon -->
    <g transform="translate(330 166)" font-size="15" font-weight="900">
      <text x="-10" y="26" text-anchor="end" fill="#6B5E86">Attaque</text>
      <g stroke="#221A3A" stroke-width="3">
        <rect x="0" y="0" width="40" height="40" rx="10" fill="#22B8F0"/><rect x="50" y="0" width="40" height="40" rx="10" fill="#FF4D6D"/>
        <rect x="100" y="0" width="40" height="40" rx="10" fill="#22B8F0"/><rect x="150" y="0" width="40" height="40" rx="10" fill="#22B8F0"/>
        <rect x="200" y="0" width="40" height="40" rx="10" fill="#FF4D6D"/><rect x="250" y="0" width="40" height="40" rx="10" fill="#22B8F0"/>
      </g>
      <rect x="302" y="-6" width="8" height="52" rx="3" fill="#221A3A"/>
      <text x="306" y="64" text-anchor="middle" fill="#6B5E86" font-size="12">mi-temps</text>
      <g stroke="#221A3A" stroke-width="3" transform="translate(322 0)">
        <rect x="0" y="0" width="40" height="40" rx="10" fill="#FF4D6D"/><rect x="50" y="0" width="40" height="40" rx="10" fill="#22B8F0"/>
        <rect x="100" y="0" width="40" height="40" rx="10" fill="#FF4D6D"/><rect x="150" y="0" width="40" height="40" rx="10" fill="#22B8F0"/>
        <rect x="200" y="0" width="40" height="40" rx="10" fill="#22B8F0"/>
      </g>
      <g class="tw" font-size="16" text-anchor="middle">
        <text x="20" y="27">✕</text><text x="70" y="27">⚒</text><text x="120" y="27">✕</text><text x="170" y="27">✸</text><text x="220" y="27">⧗</text><text x="270" y="27">✕</text>
        <text x="342" y="27">✕</text><text x="392" y="27">⚒</text><text x="442" y="27">✸</text><text x="492" y="27">✕</text><text x="542" y="27">⚒</text>
      </g>
      <text x="580" y="26" fill="#6B5E86">Défense</text>
      <text x="700" y="16" fill="#6B5E86" font-size="12">✕ élimination · ✸ charge</text><text x="700" y="34" fill="#6B5E86" font-size="12">⚒ désamorçage · ⧗ temps</text>
    </g>
    <!-- tableau des 8 héros -->
    <g transform="translate(40 250)">
      <rect width="1000" height="380" rx="16" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
      <g font-size="13" font-weight="900" fill="#C9BFEA" text-anchor="middle">
        <text x="200" y="28" text-anchor="start">Héros</text><text x="480" y="28">Élim.</text><text x="560" y="28">Morts</text><text x="640" y="28">Aides</text>
        <text x="730" y="28">Dégâts</text><text x="830" y="28">Poses / désam.</text><text x="940" y="28">MVP</text>
      </g>
      <g font-size="15" font-weight="800">
        <rect x="12" y="40" width="976" height="38" rx="10" fill="#FFC928" stroke="#221A3A" stroke-width="2.5"/>
        <rect x="22" y="45" width="28" height="28" rx="7" fill="#22B8F0" stroke="#221A3A" stroke-width="2"/>
        <text x="60" y="65" fill="#221A3A">Toi · Guerrier · Rempart</text>
        <g fill="#221A3A" text-anchor="middle"><text x="480" y="65">14</text><text x="560" y="65">6</text><text x="640" y="65">5</text><text x="730" y="65">9 820</text><text x="830" y="65">3 / 0</text><text x="940" y="65">★★★</text></g>
        <g fill="#FFF8EC">
          <rect x="22" y="89" width="28" height="28" rx="7" fill="#22B8F0" stroke="#221A3A" stroke-width="2"/><text x="60" y="109">Élouan · Chasseur · Tireur</text>
          <rect x="22" y="129" width="28" height="28" rx="7" fill="#22B8F0" stroke="#221A3A" stroke-width="2"/><text x="60" y="149">Noé · Kage · Ouvreur</text>
          <rect x="22" y="169" width="28" height="28" rx="7" fill="#22B8F0" stroke="#221A3A" stroke-width="2"/><text x="60" y="189">Daphné · Clerc · Soutien</text>
        </g>
        <g class="c"><text x="480" y="109">11</text><text x="560" y="109">5</text><text x="640" y="109">3</text><text x="730" y="109">8 410</text><text x="830" y="109">0 / 1</text><text x="940" y="109">★★</text>
          <text x="480" y="149">9</text><text x="560" y="149">8</text><text x="640" y="149">2</text><text x="730" y="149">7 030</text><text x="830" y="149">2 / 0</text><text x="940" y="149">★</text>
          <text x="480" y="189">3</text><text x="560" y="189">6</text><text x="640" y="189">12</text><text x="730" y="189">2 260</text><text x="830" y="189">0 / 1</text><text x="940" y="189">★</text></g>
        <rect x="12" y="206" width="976" height="3" fill="#FF4D6D"/>
        <g fill="#FFF8EC">
          <rect x="22" y="220" width="28" height="28" rx="7" fill="#FF4D6D" stroke="#221A3A" stroke-width="2"/><text x="60" y="240">Paladin · Rempart</text>
          <rect x="22" y="260" width="28" height="28" rx="7" fill="#FF4D6D" stroke="#221A3A" stroke-width="2"/><text x="60" y="280">Magicien · Contrôleur</text>
          <rect x="22" y="300" width="28" height="28" rx="7" fill="#FF4D6D" stroke="#221A3A" stroke-width="2"/><text x="60" y="320">Rôdeur · Tireur</text>
          <rect x="22" y="340" width="28" height="28" rx="7" fill="#FF4D6D" stroke="#221A3A" stroke-width="2"/><text x="60" y="360">Kage · Ouvreur</text>
        </g>
        <g class="c"><text x="480" y="240">8</text><text x="560" y="240">10</text><text x="640" y="240">4</text><text x="730" y="240">7 110</text><text x="830" y="240">1 / 1</text>
          <text x="480" y="280">7</text><text x="560" y="280">9</text><text x="640" y="280">6</text><text x="730" y="280">6 940</text><text x="830" y="280">0 / 0</text>
          <text x="480" y="320">6</text><text x="560" y="320">9</text><text x="640" y="320">3</text><text x="730" y="320">6 020</text><text x="830" y="320">1 / 0</text>
          <text x="480" y="360">4</text><text x="560" y="360">9</text><text x="640" y="360">2</text><text x="730" y="360">4 400</text><text x="830" y="360">2 / 0</text></g>
      </g>
    </g>
    <!-- récompenses scellées + boutons -->
    <g transform="translate(1070 250)">
      <rect width="410" height="250" rx="16" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
      <text x="20" y="34" font-size="16" font-weight="900" fill="#FFC928">GAGNÉ</text>
      <g stroke="#221A3A" stroke-width="3">
        <rect x="20" y="52" width="110" height="110" rx="16" fill="#B43BEB"/><rect x="146" y="52" width="110" height="110" rx="16" fill="#22B8F0"/>
        <rect x="272" y="52" width="110" height="110" rx="16" fill="#E9DFCB"/>
      </g>
      <rect x="272" y="52" width="110" height="110" rx="16" fill="url(#trame)"/>
      <g font-size="13" font-weight="800" fill="#FFF8EC" text-anchor="middle">
        <text x="75" y="184">Coffre d'apparence</text><text x="75" y="202">épique</text>
        <text x="201" y="184">Titre</text><text x="201" y="202">« Démineur »</text>
        <text x="327" y="184">Coffre du jour</text><text x="327" y="202">déjà pris</text>
      </g>
      <text x="20" y="236" font-size="13" font-weight="700" fill="#C9BFEA">Mode à part : ni équipement, ni maîtrise, ni insignes.</text>
    </g>
    <g transform="translate(1070 530)">
      <rect x="5" y="5" width="410" height="64" rx="16" fill="#221A3A"/>
      <rect width="410" height="64" rx="16" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
      <text x="205" y="42" text-anchor="middle" class="tw pop" font-size="24">Rejouer</text>
      <rect x="0" y="78" width="198" height="50" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><text x="99" y="109" text-anchor="middle" class="t" font-size="16">Revoir les manches</text>
      <rect x="212" y="78" width="198" height="50" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><text x="311" y="109" text-anchor="middle" class="t" font-size="16">Menu principal</text>
    </g>
  </g>
</svg>
