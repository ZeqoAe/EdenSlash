<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Maquette maison BM-TAC (17/10/2026) : HUD d'une manche de l'Assaut (mode tactique 4 contre 4) dans la DA « autocollant manga »
       (BIBLE v2). Aucun élément tiers. Vue de dessus schématique : murs d'encre, voile de la vue, héros en pastilles. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; font-weight: 700; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 900; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .s { font-size: 13px; }
      .note { fill: #C21E45; font-size: 14px; font-weight: 800; }
      .ink { stroke: #221A3A; stroke-width: 3; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.25"/></pattern>
    <pattern id="herbe" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#8FD62E" fill-opacity="0.5"/><path d="M3 9 l2 -6 l2 6 M8 11 l1.5 -5 l1.5 5" stroke="#4F8F10" stroke-width="1.5" fill="none"/></pattern>
    <mask id="vue">
      <rect width="1600" height="900" fill="white"/>
      <!-- polygone de vue de l'équipe (ce qui est vu reste clair) -->
      <path d="M560 900 L520 330 L700 300 L760 140 L1010 130 L1040 330 L1180 380 L1220 900 Z" fill="black"/>
    </mask>
  </defs>

  <!-- monde clair vu de dessus -->
  <rect width="1600" height="900" fill="#DCE3B4"/>
  <path d="M600 900 L640 520 L860 470 L900 120 L960 120 L940 500 L1180 560 L1160 900 Z" fill="#E9DFCB"/>
  <!-- murs pleins (maisons) et murets -->
  <g fill="#2E2450" class="ink">
    <rect x="300" y="180" width="220" height="300" rx="6"/><rect x="1060" y="150" width="260" height="190" rx="6"/>
    <rect x="1200" y="590" width="120" height="180" rx="6"/><rect x="380" y="600" width="150" height="200" rx="6"/>
  </g>
  <g fill="#C9BFEA" stroke="#221A3A" stroke-width="2"><rect x="700" y="400" width="90" height="12" rx="3"/><rect x="840" y="610" width="12" height="80" rx="3"/></g>
  <rect x="560" y="200" width="120" height="90" rx="14" fill="url(#herbe)" stroke="#4F8F10" stroke-width="2"/>
  <!-- site B (pose) -->
  <rect x="980" y="360" width="200" height="170" rx="18" fill="#FFC928" fill-opacity="0.3" stroke="#221A3A" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="1080" y="470" text-anchor="middle" class="pop" font-size="56" fill="#FFC928" stroke="#221A3A" stroke-width="6" paint-order="stroke">B</text>
  <!-- voile de ce qui n'est pas vu (trame + encre à 35 %) -->
  <g mask="url(#vue)"><rect width="1600" height="900" fill="#2E2450" opacity="0.38"/><rect width="1600" height="900" fill="url(#trame)"/></g>

  <!-- alliés (lagon), contour blanc ; héros du joueur avec anneau soleil -->
  <g stroke="#221A3A" stroke-width="3">
    <circle cx="800" cy="640" r="19" fill="#22B8F0"/><circle cx="700" cy="720" r="17" fill="#22B8F0"/><circle cx="905" cy="700" r="17" fill="#22B8F0"/>
  </g>
  <ellipse cx="800" cy="652" rx="36" ry="14" fill="none" stroke="#FFC928" stroke-width="4"/>
  <!-- porteur de la charge : pastille soleil sur l'épaule -->
  <g transform="translate(818 618)"><circle r="11" fill="#FFC928" stroke="#221A3A" stroke-width="2.5"/><path d="M-4 -2 h8 v7 h-8 z M-2 -5 h4 v3 h-4z" fill="#221A3A"/></g>
  <!-- ennemi vu (fraise) avec sa plaque -->
  <circle cx="1010" cy="300" r="18" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
  <g transform="translate(940 254)"><rect width="140" height="30" rx="10" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="6" y="6" width="18" height="18" rx="5" fill="#FF8A1F" stroke="#221A3A" stroke-width="2"/>
    <text x="30" y="21" class="t s">Kage · Ouvreur</text></g>
  <!-- ennemi perdu de vue : dernière position (fantôme qui s'efface) -->
  <circle cx="1240" cy="470" r="18" fill="none" stroke="#FF4D6D" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="1240" y="477" text-anchor="middle" class="tw" font-size="18">?</text>
  <text x="1240" y="505" text-anchor="middle" class="t s" fill="#C21E45">vu il y a 3 s</text>
  <!-- bruit entendu derrière un mur : arcs fraise -->
  <g fill="none" stroke="#FF4D6D" stroke-width="3" opacity="0.8"><path d="M560 520 a30 30 0 0 1 0 -60"/><path d="M545 535 a50 50 0 0 1 0 -90"/></g>
  <text x="470" y="500" class="tw s" font-size="14">Pas</text>
  <!-- repère d'équipe posé au sol (ping) -->
  <g transform="translate(1080 600)"><path d="M0 0 l-14 -26 a16 16 0 1 1 28 0 z" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/><text x="0" y="-30" text-anchor="middle" class="tw" font-size="16">!</text></g>
  <g transform="translate(1104 560)"><rect width="150" height="30" rx="12" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/><text x="75" y="21" text-anchor="middle" class="tw s" font-size="14">Ennemi · Halle</text></g>
  <!-- bulle d'un allié IA (ordre lu) -->
  <g transform="translate(560 690)"><rect width="150" height="34" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><path d="M118 34 l14 14 l2 -14 z" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><text x="75" y="23" text-anchor="middle" class="t s" font-size="15">Je couvre B !</text></g>

  <!-- 1. BANDEAU DU SCORE (haut-centre) : portraits 4 + 4, score, minuteur, état de la charge -->
  <g transform="translate(330 14)">
    <rect x="7" y="7" width="940" height="76" rx="18" fill="#221A3A"/>
    <rect width="940" height="76" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <!-- alliés -->
    <g stroke="#221A3A" stroke-width="3">
      <rect x="14" y="12" width="52" height="52" rx="12" fill="#22B8F0"/><rect x="74" y="12" width="52" height="52" rx="12" fill="#22B8F0"/>
      <rect x="134" y="12" width="52" height="52" rx="12" fill="#22B8F0"/><rect x="194" y="12" width="52" height="52" rx="12" fill="#C9BFEA"/>
    </g>
    <rect x="194" y="12" width="52" height="52" rx="12" fill="url(#trame)"/>
    <path d="M206 24 l28 28 M234 24 l-28 28" stroke="#221A3A" stroke-width="5"/>
    <g fill="#FFC928" stroke="#221A3A" stroke-width="1.5"><circle cx="30" cy="70" r="4"/><circle cx="40" cy="70" r="4"/><circle cx="50" cy="70" r="4"/><circle cx="160" cy="70" r="4"/></g>
    <text x="40" y="45" text-anchor="middle" class="tw" font-size="15">TOI</text>
    <!-- score -->
    <rect x="270" y="10" width="80" height="56" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <text x="310" y="52" text-anchor="middle" class="tw pop" font-size="34">4</text>
    <rect x="590" y="10" width="80" height="56" rx="14" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
    <text x="630" y="52" text-anchor="middle" class="tw pop" font-size="34">3</text>
    <rect x="364" y="6" width="212" height="64" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <text x="470" y="44" text-anchor="middle" class="pop" font-size="30" fill="#FFF8EC">1:12</text>
    <text x="470" y="63" text-anchor="middle" font-size="13" font-weight="800" fill="#C9BFEA">Manche 8 · Attaque</text>
    <!-- adversaires -->
    <g stroke="#221A3A" stroke-width="3">
      <rect x="694" y="12" width="52" height="52" rx="12" fill="#FF4D6D"/><rect x="754" y="12" width="52" height="52" rx="12" fill="#FF4D6D"/>
      <rect x="814" y="12" width="52" height="52" rx="12" fill="#C9BFEA"/><rect x="874" y="12" width="52" height="52" rx="12" fill="#C9BFEA"/>
    </g>
    <rect x="814" y="12" width="112" height="52" rx="12" fill="url(#trame)"/>
    <path d="M826 24 l28 28 M854 24 l-28 28 M886 24 l28 28 M914 24 l-28 28" stroke="#221A3A" stroke-width="5"/>
  </g>
  <!-- état de la charge sous le score -->
  <g transform="translate(680 100)"><rect width="240" height="34" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="120" y="23" text-anchor="middle" class="tw" font-size="16">Charge : c'est toi qui l'as</text></g>
  <!-- annonce centrale (une à la fois) -->
  <g transform="translate(660 150) rotate(-3)"><rect width="280" height="48" rx="16" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <text x="140" y="32" text-anchor="middle" class="tw pop" font-size="22">2 contre 4 !</text></g>

  <!-- 2. RADAR (haut-droite) : carte de la manche, sites, alliés avec cône de vue, ennemis vus / derniers vus, repères -->
  <g transform="translate(1310 14)">
    <rect x="7" y="7" width="276" height="300" rx="18" fill="#221A3A"/>
    <rect width="276" height="300" rx="18" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <rect x="14" y="14" width="248" height="272" rx="10" fill="#E9DFCB" opacity="0.92"/>
    <g fill="#2E2450"><rect x="40" y="80" width="40" height="80"/><rect x="190" y="70" width="50" height="70"/><rect x="120" y="60" width="36" height="22"/><rect x="60" y="190" width="40" height="70"/><rect x="180" y="170" width="30" height="80"/></g>
    <rect x="20" y="22" width="70" height="56" rx="8" fill="#FFC928" fill-opacity="0.5" stroke="#221A3A" stroke-width="2"/>
    <rect x="186" y="24" width="70" height="56" rx="8" fill="#FFC928" fill-opacity="0.5" stroke="#221A3A" stroke-width="2"/>
    <text x="55" y="58" text-anchor="middle" class="tw pop" font-size="20">A</text><text x="221" y="60" text-anchor="middle" class="tw pop" font-size="20">B</text>
    <path d="M140 220 l-22 -40 a46 46 0 0 1 44 0 z" fill="#FFFFFF" opacity="0.55"/>
    <g stroke="#221A3A" stroke-width="2"><circle cx="140" cy="220" r="7" fill="#FFC928"/><circle cx="118" cy="240" r="6" fill="#22B8F0"/><circle cx="162" cy="236" r="6" fill="#22B8F0"/><circle cx="196" cy="120" r="6" fill="#FF4D6D"/></g>
    <circle cx="232" cy="150" r="6" fill="none" stroke="#FF4D6D" stroke-width="2.5" stroke-dasharray="3 2"/>
    <path d="M208 196 l-6 -11 a7 7 0 1 1 12 0 z" fill="#FF4D6D" stroke="#221A3A" stroke-width="1.5"/>
    <text x="138" y="112" text-anchor="middle" font-size="11" font-weight="800" font-style="italic" fill="#221A3A">Halle</text>
  </g>
  <!-- fil des éliminations en pastilles -->
  <g transform="translate(1310 330)" font-size="14" font-weight="800">
    <rect width="276" height="32" rx="12" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="8" y="7" width="18" height="18" rx="5" fill="#22B8F0" stroke="#221A3A" stroke-width="2"/><text x="32" y="22" fill="#221A3A">Élouan</text>
    <text x="104" y="22" fill="#C21E45">⚔</text><rect x="124" y="7" width="18" height="18" rx="5" fill="#FF4D6D" stroke="#221A3A" stroke-width="2"/><text x="148" y="22" fill="#221A3A">Paladin</text>
    <rect y="40" width="276" height="32" rx="12" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="8" y="47" width="18" height="18" rx="5" fill="#FF4D6D" stroke="#221A3A" stroke-width="2"/><text x="32" y="62" fill="#221A3A">Kage</text>
    <text x="104" y="62" fill="#C21E45">⚔</text><rect x="124" y="47" width="18" height="18" rx="5" fill="#22B8F0" stroke="#221A3A" stroke-width="2"/><text x="148" y="62" fill="#221A3A">Daphné</text>
  </g>

  <!-- 3. OR (bas-gauche) -->
  <g transform="translate(24 790)"><rect x="5" y="5" width="300" height="76" rx="16" fill="#221A3A"/>
    <rect width="300" height="76" rx="16" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <circle cx="36" cy="38" r="20" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="36" y="45" text-anchor="middle" class="tw" font-size="18">or</text>
    <text x="68" y="44" class="pop" font-size="28" fill="#221A3A">1 850</text>
    <text x="68" y="66" font-size="13" font-weight="700" fill="#6B5E86">prochaine manche : +1 500 au moins</text></g>

  <!-- 4. CARTE DE VIE + SORTS + UTILITAIRES (bas-centre) -->
  <g transform="translate(470 770)">
    <rect x="7" y="7" width="660" height="116" rx="18" fill="#221A3A"/>
    <rect width="660" height="116" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <!-- bouclier (cuirasse) en 2 crans lagon au-dessus de la vie fraise -->
    <rect x="16" y="12" width="300" height="14" rx="7" fill="#2E2450" stroke="#221A3A" stroke-width="2.5"/>
    <rect x="18" y="14" width="146" height="10" rx="5" fill="#22B8F0"/><rect x="166" y="14" width="80" height="10" rx="5" fill="#22B8F0"/>
    <rect x="16" y="30" width="300" height="26" rx="12" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <rect x="19" y="33" width="196" height="20" rx="10" fill="#FF4D6D"/><rect x="215" y="33" width="34" height="20" fill="#FFFFFF" opacity="0.6"/>
    <text x="166" y="49" text-anchor="middle" class="tw" font-size="16">1 340 / 2 000</text>
    <!-- sorts : 1 signature (gratuit), 2 acheté (en recharge), 3 non acheté (tramé, cadenas), 4 ultime (5 / 7 points) -->
    <g stroke="#221A3A" stroke-width="3">
      <rect x="336" y="12" width="58" height="58" rx="14" fill="#FFC928"/>
      <rect x="402" y="12" width="58" height="58" rx="14" fill="#B43BEB"/>
      <rect x="468" y="12" width="58" height="58" rx="14" fill="#C9BFEA"/>
      <rect x="534" y="12" width="58" height="58" rx="14" fill="#22B8F0"/>
      <rect x="600" y="16" width="48" height="48" rx="12" fill="#8FD62E"/>
    </g>
    <path d="M431 41 L431 12 A29 29 0 0 1 458 51 Z" fill="#221A3A" opacity="0.55"/>
    <text x="431" y="48" text-anchor="middle" class="tw" font-size="18">3</text>
    <rect x="468" y="12" width="58" height="58" rx="14" fill="url(#trame)"/>
    <path d="M489 38 v-6 a8 8 0 0 1 16 0 v6 M485 38 h24 v16 h-24 z" fill="#FFF8EC" stroke="#221A3A" stroke-width="2.5"/>
    <g fill="#FFC928" stroke="#221A3A" stroke-width="1.5"><circle cx="540" cy="80" r="4"/><circle cx="550" cy="80" r="4"/><circle cx="560" cy="80" r="4"/><circle cx="570" cy="80" r="4"/><circle cx="580" cy="80" r="4"/></g>
    <g fill="#FFF8EC" stroke="#221A3A" stroke-width="1.5"><circle cx="590" cy="80" r="4"/><circle cx="600" cy="80" r="4"/></g>
    <g font-size="12" font-weight="900"><text x="365" y="88" text-anchor="middle" fill="#221A3A">gratuit</text><text x="497" y="88" text-anchor="middle" fill="#6B5E86">250 or</text></g>
    <text x="624" y="47" text-anchor="middle" class="tw" font-size="13">Esq.</text>
    <!-- utilitaires (2 cases) et fiole -->
    <g font-size="13" font-weight="800" fill="#221A3A">
      <rect x="16" y="66" width="96" height="40" rx="12" fill="#86DDFF" stroke="#221A3A" stroke-width="3"/><text x="64" y="84" text-anchor="middle">Brume</text><text x="64" y="100" text-anchor="middle" font-size="12">× 1 · [Q]</text>
      <rect x="120" y="66" width="96" height="40" rx="12" fill="#FFE27A" stroke="#221A3A" stroke-width="3"/><text x="168" y="84" text-anchor="middle">Éclat</text><text x="168" y="100" text-anchor="middle" font-size="12">× 2 · [E]</text>
      <rect x="224" y="66" width="92" height="40" rx="12" fill="#FF9DB0" stroke="#221A3A" stroke-width="3"/><text x="270" y="84" text-anchor="middle">Fiole</text><text x="270" y="100" text-anchor="middle" font-size="12">soin · [C]</text>
    </g>
  </g>
  <!-- invite contextuelle sur le site -->
  <g transform="translate(700 560)"><rect width="200" height="36" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <circle cx="22" cy="18" r="12" fill="#8FD62E" stroke="#221A3A" stroke-width="2"/><text x="22" y="23" text-anchor="middle" class="tw" font-size="13">F</text>
    <text x="42" y="24" class="t" font-size="15">Poser la charge · 4 s</text></g>

  <!-- notes de conception -->
  <rect x="14" y="232" width="440" height="152" rx="14" fill="#FFF8EC" stroke="#C21E45" stroke-width="2" stroke-dasharray="6 4"/>
  <g class="note" transform="translate(4 222)">
    <text x="24" y="40">① Score, minuteur, 4 + 4 portraits (✕ = à terre,</text>
    <text x="24" y="58">    points soleil = ultime prêt bientôt).</text>
    <text x="24" y="84">② Ce que l'équipe ne voit pas est voilé (trame) :</text>
    <text x="24" y="102">    les murs coupent la vue ; « ? » = dernière position.</text>
    <text x="24" y="128">③ Les bruits proches deviennent des arcs (pas, sorts).</text>
    <text x="24" y="154">④ Sort 1 gratuit, 2 et 3 achetés, 4 = ultime à points.</text>
  </g>
  <text x="1588" y="890" text-anchor="end" font-size="12" font-weight="700" fill="#6B5E86">Eden Slash v0.1.xxx</text>
</svg>
