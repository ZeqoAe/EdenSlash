<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Maquette maison BM-SURV (17/10/2026) : choix de carte du Survivant v2, DA « autocollant manga ». Aucun élément tiers. -->
  <defs>
    <style>
      .t { fill: #221A3A; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .note { fill: #C21E45; font-size: 14px; font-weight: 700; }
      .gain { fill: #3E7F0A; font-weight: 800; }
      .sec { fill: #6B5E86; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.18"/></pattern>
    <radialGradient id="voile" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#2E2450" stop-opacity="0.35"/><stop offset="1" stop-color="#120C24" stop-opacity="0.75"/></radialGradient>
  </defs>

  <!-- le jeu reste visible derrière, flouté et voilé (le joueur garde le contexte) -->
  <rect width="1600" height="900" fill="#ACB47F"/>
  <g fill="#FF8A1F" stroke="#221A3A" stroke-width="2" opacity="0.7"><circle cx="300" cy="250" r="16"/><circle cx="1300" cy="700" r="16"/><circle cx="1250" cy="200" r="16"/><circle cx="200" cy="720" r="16"/></g>
  <rect width="1600" height="900" fill="url(#voile)"/>

  <!-- titre incliné -3°, traits de vitesse discrets -->
  <text x="560" y="92" text-anchor="middle" class="tw pop" font-size="40" transform="rotate(-3 560 92)">Niveau 14 !</text>
  <text x="560" y="128" text-anchor="middle" fill="#FFF8EC" font-size="19" font-weight="700">Choisis une carte · 2 autres en attente</text>
  <g fill="#FFC928" stroke="#221A3A" stroke-width="2"><circle cx="782" cy="122" r="7"/><circle cx="800" cy="122" r="7"/></g>

  <!-- ===== Carte 1 : Amélioration de pièce (épique) ===== -->
  <g transform="translate(60 168)">
    <rect x="7" y="7" width="320" height="470" rx="18" fill="#221A3A"/>
    <rect x="0" y="0" width="320" height="470" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <!-- bandeau de rareté 2 tons -->
    <path d="M0 18 a18 18 0 0 1 18 -18 h284 a18 18 0 0 1 18 18 v42 h-320 z" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
    <rect x="3" y="44" width="314" height="14" fill="#7A1DB0"/>
    <text x="20" y="38" class="tw" font-size="17">1</text>
    <text x="44" y="38" class="tw" font-size="17">Tête · Épique</text>
    <rect x="236" y="14" width="70" height="28" rx="10" fill="#FFF8EC" stroke="#221A3A" stroke-width="3" transform="rotate(6 271 28)"/>
    <text x="271" y="34" text-anchor="middle" class="t" font-size="13" font-weight="800" transform="rotate(6 271 28)">PIÈCE</text>
    <!-- icône du jeu dans une case -->
    <rect x="20" y="76" width="76" height="76" rx="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
    <text x="108" y="100" class="t" font-size="18" font-weight="800">Couronne du Festin</text>
    <text x="108" y="140" class="pop t" font-size="30">+4 → +6</text>
    <!-- jauge 10 crans, losanges +6 +8 +10 -->
    <g stroke="#221A3A" stroke-width="2">
      <rect x="20" y="168" width="26" height="12" rx="3" fill="#FFC928"/><rect x="48" y="168" width="26" height="12" rx="3" fill="#FFC928"/>
      <rect x="76" y="168" width="26" height="12" rx="3" fill="#FFC928"/><rect x="104" y="168" width="26" height="12" rx="3" fill="#FFC928"/>
      <rect x="132" y="168" width="26" height="12" rx="3" fill="#8FD62E"/><rect x="160" y="168" width="26" height="12" rx="3" fill="#8FD62E"/>
      <rect x="188" y="168" width="26" height="12" rx="3" fill="url(#trame)"/><rect x="216" y="168" width="26" height="12" rx="3" fill="url(#trame)"/>
      <rect x="244" y="168" width="26" height="12" rx="3" fill="url(#trame)"/><rect x="272" y="168" width="26" height="12" rx="3" fill="url(#trame)"/>
    </g>
    <!-- le passif tiré, écrit en grand : c'est la décision -->
    <rect x="20" y="196" width="280" height="96" rx="14" fill="#FFE27A" stroke="#221A3A" stroke-width="3"/>
    <text x="34" y="222" class="t" font-size="15" font-weight="800">Nouveau passif · Onde de choc</text>
    <text x="34" y="248" class="t" font-size="16">Une auto-attaque sur sept</text>
    <text x="34" y="270" class="t" font-size="16">libère une onde de choc.</text>
    <!-- 2 lignes de stats max -->
    <text x="20" y="324" class="t" font-size="16">Intelligence 19 → <tspan class="gain">22 ▲</tspan></text>
    <text x="20" y="350" class="t" font-size="16">Agilité 18 → <tspan class="gain">22 ▲</tspan></text>
    <!-- synergie -->
    <rect x="20" y="368" width="280" height="34" rx="10" fill="#C3F07A" stroke="#221A3A" stroke-width="2"/>
    <text x="34" y="390" class="t" font-size="14" font-weight="800">◆ Évolution : + Braise → Séisme</text>
    <text x="20" y="430" class="sec" font-size="14">Maj : tout le détail · 🔒 gardée à vie</text>
  </g>

  <!-- ===== Carte 2 : Arme (légendaire, choisie au survol) ===== -->
  <g transform="translate(400 156) rotate(-1.5 160 240)">
    <rect x="8" y="10" width="320" height="482" rx="18" fill="#221A3A"/>
    <!-- rayons de soleil derrière la légendaire -->
    <rect x="0" y="0" width="320" height="482" rx="18" fill="#FFF8EC" stroke="#0B7DB5" stroke-width="5"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h284 a18 18 0 0 1 18 18 v42 h-320 z" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <rect x="3" y="44" width="314" height="14" fill="#D9900B"/>
    <text x="20" y="38" class="tw" font-size="17">2</text>
    <text x="44" y="38" class="tw" font-size="17">Arme · Légendaire</text>
    <rect x="236" y="14" width="70" height="28" rx="10" fill="#FFF8EC" stroke="#221A3A" stroke-width="3" transform="rotate(-5 271 28)"/>
    <text x="271" y="34" text-anchor="middle" class="t" font-size="13" font-weight="800" transform="rotate(-5 271 28)">ARME</text>
    <rect x="20" y="76" width="76" height="76" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <path d="M58 82 l5 12 l12 0 l-10 8 l4 12 l-11 -7 l-11 7 l4 -12 l-10 -8 l12 0 z" fill="#FFFFFF" stroke="#221A3A" stroke-width="2"/>
    <text x="108" y="100" class="t" font-size="18" font-weight="800">Marteau de l'Ion</text>
    <text x="108" y="140" class="pop t" font-size="30">+0 → +4</text>
    <rect x="20" y="170" width="280" height="96" rx="14" fill="#86DDFF" stroke="#221A3A" stroke-width="3"/>
    <text x="34" y="196" class="t" font-size="15" font-weight="800">★ Effet acquis à +4</text>
    <text x="34" y="222" class="t" font-size="16">Projectile en plus sur</text>
    <text x="34" y="244" class="t" font-size="16">chaque coup de marteau.</text>
    <text x="20" y="300" class="t" font-size="16">Attaque 64 → <tspan class="gain">93 ▲</tspan></text>
    <text x="20" y="326" class="t" font-size="16">Auto-attaque <tspan class="gain">plus forte ▲</tspan></text>
    <text x="20" y="442" class="sec" font-size="14">Maj : tout le détail</text>
    <!-- pastille « focus manette » -->
    <rect x="96" y="452" width="128" height="40" rx="14" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/>
    <text x="160" y="478" text-anchor="middle" class="tw" font-size="16">Ⓐ Prendre</text>
  </g>

  <!-- ===== Carte 3 : Nouveau sort (rare) ===== -->
  <g transform="translate(740 168)">
    <rect x="7" y="7" width="320" height="470" rx="18" fill="#221A3A"/>
    <rect x="0" y="0" width="320" height="470" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h284 a18 18 0 0 1 18 18 v42 h-320 z" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <rect x="3" y="44" width="314" height="14" fill="#0B7DB5"/>
    <text x="20" y="38" class="tw" font-size="17">3</text>
    <text x="44" y="38" class="tw" font-size="17">Sort · Nouveau !</text>
    <rect x="236" y="14" width="70" height="28" rx="10" fill="#FFF8EC" stroke="#221A3A" stroke-width="3" transform="rotate(4 271 28)"/>
    <text x="271" y="34" text-anchor="middle" class="t" font-size="13" font-weight="800" transform="rotate(4 271 28)">SORT</text>
    <rect x="20" y="76" width="76" height="76" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <text x="108" y="100" class="t" font-size="18" font-weight="800">Cyclone de combat</text>
    <text x="108" y="140" class="pop t" font-size="26">Niv. 1 / 10</text>
    <text x="20" y="196" class="t" font-size="16">Tourbillon autour du héros</text>
    <text x="20" y="220" class="t" font-size="16">pendant 4 s.</text>
    <text x="20" y="262" class="sec" font-size="15">Case 3 · recharge 9 s</text>
    <rect x="20" y="368" width="280" height="34" rx="10" fill="#C3F07A" stroke="#221A3A" stroke-width="2"/>
    <text x="34" y="390" class="t" font-size="14" font-weight="800">◆ Va avec : Lame large (porté)</text>
    <text x="20" y="430" class="sec" font-size="14">Maj : tout le détail</text>
  </g>

  <!-- ===== Panneau « Ton équipement » (aide à la décision, comme les références) ===== -->
  <g transform="translate(1100 168)">
    <rect x="7" y="7" width="440" height="470" rx="18" fill="#221A3A"/>
    <rect x="0" y="0" width="440" height="470" rx="18" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <text x="20" y="36" fill="#FFF8EC" font-size="20" font-weight="800">Ton équipement</text>
    <!-- grille arme + 8 cases ; la case visée par la carte survolée clignote -->
    <g stroke="#221A3A" stroke-width="3">
      <rect x="20" y="54" width="110" height="52" rx="12" fill="#FF8A1F"/>
      <rect x="140" y="54" width="52" height="52" rx="12" fill="#B43BEB"/><rect x="200" y="54" width="52" height="52" rx="12" fill="#22B8F0"/>
      <rect x="260" y="54" width="52" height="52" rx="12" fill="#FFC928"/><rect x="320" y="54" width="52" height="52" rx="12" fill="#8FD62E"/>
      <rect x="140" y="114" width="52" height="52" rx="12" fill="#B43BEB"/><rect x="200" y="114" width="52" height="52" rx="12" fill="url(#trame)"/>
      <rect x="260" y="114" width="52" height="52" rx="12" fill="#C9C3D6"/><rect x="320" y="114" width="52" height="52" rx="12" fill="url(#trame)"/>
    </g>
    <rect x="16" y="50" width="118" height="60" rx="14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="20" y="196" fill="#C9BFEA" font-size="15" font-weight="700">Héros (si tu prends la carte survolée)</text>
    <g font-size="16">
      <text x="20" y="226" fill="#FFF8EC">Attaque</text><text x="420" y="226" text-anchor="end" fill="#FFF8EC">1 893 → <tspan fill="#C3F07A" font-weight="800">2 140 ▲</tspan></text>
      <text x="20" y="254" fill="#FFF8EC">Vitesse d'attaque</text><text x="420" y="254" text-anchor="end" fill="#FFF8EC">×1,9</text>
      <text x="20" y="282" fill="#FFF8EC">Critique</text><text x="420" y="282" text-anchor="end" fill="#FFF8EC">48</text>
      <text x="20" y="310" fill="#FFF8EC">Vie</text><text x="420" y="310" text-anchor="end" fill="#FFF8EC">12 000</text>
    </g>
    <text x="20" y="352" fill="#C9BFEA" font-size="15" font-weight="700">Panoplies</text>
    <text x="20" y="378" fill="#C3F07A" font-size="16" font-weight="800">◆ Tempête 3 / 5 · prochain bonus à 5</text>
    <text x="20" y="404" fill="#FFF8EC" font-size="16">◇ Festin du Fantôme 1 / 5</text>
    <text x="20" y="446" fill="#C9BFEA" font-size="15">Sorts 6 / 12 · Évolutions 1 / 3 possibles</text>
  </g>

  <!-- ===== Barre d'actions unique (au lieu de 2 boutons par carte) ===== -->
  <g transform="translate(60 690) scale(0.86)">
    <g>
      <rect x="5" y="5" width="250" height="60" rx="16" fill="#221A3A"/>
      <rect x="0" y="0" width="250" height="60" rx="16" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
      <circle cx="34" cy="30" r="17" fill="#22B8F0" stroke="#FFFFFF" stroke-width="3"/><text x="34" y="36" text-anchor="middle" class="tw" font-size="15">X</text>
      <text x="140" y="38" text-anchor="middle" class="tw" font-size="20">Relancer · 2</text>
    </g>
    <g transform="translate(280 0)">
      <rect x="5" y="5" width="250" height="60" rx="16" fill="#221A3A"/>
      <rect x="0" y="0" width="250" height="60" rx="16" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
      <circle cx="34" cy="30" r="17" fill="#FFC928" stroke="#FFFFFF" stroke-width="3"/><text x="34" y="36" text-anchor="middle" class="tw" font-size="15">Y</text>
      <text x="140" y="38" text-anchor="middle" class="tw" font-size="20">Bannir… · 3</text>
    </g>
    <g transform="translate(560 0)">
      <rect x="5" y="5" width="250" height="60" rx="16" fill="#221A3A"/>
      <rect x="0" y="0" width="250" height="60" rx="16" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
      <circle cx="34" cy="30" r="17" fill="#8FD62E" stroke="#FFFFFF" stroke-width="3"/><text x="34" y="36" text-anchor="middle" class="tw" font-size="14">LB</text>
      <text x="140" y="38" text-anchor="middle" class="tw" font-size="20">Garder… · 3</text>
    </g>
    <g transform="translate(840 0)">
      <rect x="5" y="5" width="250" height="60" rx="16" fill="#221A3A"/>
      <rect x="0" y="0" width="250" height="60" rx="16" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
      <circle cx="34" cy="30" r="17" fill="#FF4D6D" stroke="#FFFFFF" stroke-width="3"/><text x="34" y="36" text-anchor="middle" class="tw" font-size="15">B</text>
      <text x="140" y="38" text-anchor="middle" class="t" font-size="20" font-weight="800">Passer · +57 or</text>
    </g>
  </g>
  <text x="60" y="780" style="fill:#FFE27A;font-size:14px;font-weight:700">« Bannir… » et « Garder… » passent en mode visée : les cartes éligibles se soulèvent, les autres se grisent ; un clic ou A sur la carte, B annule.</text>

  <g transform="translate(1100 792)">
    <rect x="0" y="0" width="440" height="92" rx="14" fill="#FFF8EC" stroke="#C21E45" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="14" y="26" class="note">Maquette BM-SURV · choix de carte v2</text>
    <text x="14" y="50" class="t" font-size="14">1 décision par carte (le passif tiré, l'effet ★, le sort)</text>
    <text x="14" y="72" class="t" font-size="14">≤ 4 lignes · synergie en pastille verte · Maj = détail</text>
  </g>
</svg>
