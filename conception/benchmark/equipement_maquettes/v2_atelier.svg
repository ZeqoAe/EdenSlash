  <rect x="1024" y="372" width="530" height="80" rx="12" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/>
  <text x="1040" y="400" class="t" font-size="15"><tspan class="b">Plan trouvé</tspan> : coffre d'emplacement, Avila, carte 2</text>
