  <text x="1289" y="740" class="tw pop" font-size="22" text-anchor="middle">Fabriquer · 83 ◆</text>
  <rect x="1024" y="774" width="260" height="48" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
