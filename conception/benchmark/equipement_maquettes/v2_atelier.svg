  <rect x="1294" y="774" width="260" height="48" rx="14" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/>
  <text x="1424" y="805" class="t b" font-size="15" text-anchor="middle">★ Objectif</text>
  <text x="1024" y="852" class="note">Fabriquée : la pièce saute dans sa case (arc 280 ms), « clac ».</text>
  <text x="1028" y="600" class="note">Plus de ligne « Prochaine amélioration : 100 % » ni « Niveau de puissance »</text>
