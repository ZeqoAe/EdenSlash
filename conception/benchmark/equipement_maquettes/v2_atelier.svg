<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Maquette maison BM-GEAR (17/10/2026) : Atelier > Fabriquer, version 2 (rangé par palier comme une poupée, objectifs,
       « il te manque », fabriquer et équiper), DA BIBLE v2. Aucun élément tiers. Notes en fraise = spécification. -->
  <defs>
    <style>
