    <rect x="40" y="476" width="128" height="32" rx="10" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="104" y="498" class="tw" font-size="14" text-anchor="middle">Ma classe</text>
    <rect x="176" y="476" width="128" height="32" rx="10" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="240" y="498" class="t" font-size="14" text-anchor="middle">Abordables</text>
