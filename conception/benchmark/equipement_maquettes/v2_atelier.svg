    <rect x="590" y="26" width="200" height="42" rx="12" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="690" y="54" class="t b" text-anchor="middle">Plans de donjon</text>
    <rect x="800" y="26" width="140" height="42" rx="12" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="870" y="54" class="t b" text-anchor="middle">Forge</text>
  </g>
  <rect x="1150" y="22" width="430" height="46" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <text x="1170" y="52" class="tp">◆ <tspan class="b">303</tspan> insignes    ✧ <tspan class="b">420</tspan> cristaux    ✕ Échap</text>

