  <text x="1040" y="227" class="tw" font-size="18">▲ Meilleure pour Guerrier · PE +621</text>
  <text x="1028" y="290" class="pop" font-size="34" fill="#221A3A">2 724</text><text x="1150" y="288" class="t">PV  <tspan class="g">+1 161</tspan></text>
  <text x="1028" y="322" class="t">★ Force 111 <tspan class="g">+40</tspan>   ★ Défense 88 <tspan class="g">+22</tspan></text>
