    <text x="875" y="270" class="s" text-anchor="middle" font-size="14">? Plan à trouver</text>
    <text x="875" y="360" class="s" text-anchor="middle" font-size="14">Torse · coffre du boss</text>
    <text x="495" y="550" class="s" text-anchor="middle" font-size="14">Jambes · 83 ◆</text>
    <text x="685" y="550" class="t" text-anchor="middle" font-size="14">Gants ✓</text>
    <text x="875" y="550" class="t" text-anchor="middle" font-size="14">Bottes ✓</text>
    <text x="495" y="650" class="s" text-anchor="middle" font-size="14">? Plan à trouver</text>
    <text x="495" y="740" class="s" text-anchor="middle" font-size="14">Cape · Avila, carte 2</text>
    <text x="685" y="740" class="s" text-anchor="middle" font-size="14">Collier · 83 ◆</text>
    <text x="875" y="740" class="s" text-anchor="middle" font-size="14">Bague · 83 ◆</text>
  </g>
  <rect x="740" y="198" width="28" height="28" rx="8" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/><text x="754" y="218" class="tw" font-size="14" text-anchor="middle">★</text>
  <text x="404" y="790" class="s" font-size="14">plein = fabriquée · voilé = plan connu (prix) · trame = plan à trouver (et où)</text>
  <rect x="404" y="806" width="552" height="48" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
  <text x="680" y="837" class="tw" font-size="16" text-anchor="middle">Fabriquer les 4 plans connus · 332 ◆ (il en manque 29)</text>

