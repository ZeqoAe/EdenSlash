<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Maquette maison BM-GEAR (17/10/2026) : écran Héros > Équipement, version 2, DA « autocollant manga » (BIBLE v2).
       Aucun élément tiers. Les cases d'objets sont des emplacements (les vraies icônes du jeu s'y posent). Notes en fraise = spécification. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; }
      .s { fill: #6B5E86; font-size: 15px; }
      .tp { fill: #FFF8EC; font-size: 16px; }
      .sp { fill: #C9BFEA; font-size: 14px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .note { fill: #C21E45; font-size: 13px; font-weight: 700; }
      .b { font-weight: 800; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.18"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#CCDEF3"/>

  <!-- en-tête -->
  <g>
    <rect x="22" y="22" width="150" height="48" rx="14" fill="#221A3A"/><rect x="18" y="18" width="150" height="48" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <text x="93" y="49" class="t b" text-anchor="middle">◀ Retour</text>
    <text x="200" y="62" class="pop tw" font-size="34" transform="rotate(-3 200 62)">Héros</text>
    <!-- niveau de héros -->
    <rect x="330" y="26" width="300" height="40" rx="12" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <text x="344" y="53" class="tp b">Niv. 34</text>
    <rect x="420" y="38" width="196" height="16" rx="8" fill="#120C24"/><rect x="420" y="38" width="120" height="16" rx="8" fill="#8FD62E" stroke="#221A3A" stroke-width="2"/>
    <!-- PE et prochain palier -->
    <rect x="660" y="18" width="520" height="56" rx="16" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <text x="680" y="44" class="s">Puissance</text>
    <text x="680" y="66" class="pop" font-size="24" fill="#221A3A">5 960</text>
    <text x="800" y="44" class="s">vers Héroïque (Beluga)</text>
    <rect x="800" y="52" width="250" height="12" rx="6" fill="#2E2450"/><rect x="800" y="52" width="208" height="12" rx="6" fill="#FFC928" stroke="#221A3A" stroke-width="2"/>
    <text x="1060" y="64" class="t b" font-size="15">−1 240</text>
    <!-- classe -->
    <rect x="1200" y="18" width="380" height="56" rx="16" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <rect x="1210" y="25" width="42" height="42" rx="9" fill="#FFE27A" stroke="#221A3A" stroke-width="3"/>
    <text x="1264" y="44" class="t b">Guerrier ▾</text><text x="1264" y="64" class="t" font-size="14">Puissance · maîtrise 14 · « Briseur »</text>
  </g>

  <!-- navigation (4 onglets verticaux) -->
  <g>
    <rect x="18" y="100" width="190" height="52" rx="14" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="40" y="133" class="tw" font-size="19">Équipement</text>
    <rect x="18" y="164" width="190" height="52" rx="14" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="40" y="197" class="t b">Classe</text>
    <circle cx="186" cy="176" r="13" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/><text x="186" y="181" class="tw" font-size="13" text-anchor="middle">2</text>
    <rect x="18" y="228" width="190" height="52" rx="14" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="40" y="261" class="t b">Apparence</text>
    <rect x="18" y="292" width="190" height="52" rx="14" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="40" y="325" class="t b">Titres</text>
    <text x="22" y="372" class="note">Titres = onglet à part</text>
    <text x="22" y="388" class="note">(aujourd'hui caché ailleurs)</text>
  </g>

  <!-- panneau poupée -->
  <rect x="234" y="104" width="560" height="704" rx="18" fill="#221A3A"/>
  <rect x="228" y="98" width="560" height="704" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <rect x="231" y="650" width="554" height="149" fill="url(#trame)"/>
  <!-- préréglages : vrais onglets -->
  <g>
    <rect x="246" y="112" width="120" height="44" rx="12" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="306" y="140" class="tw" font-size="15" text-anchor="middle">Mêlée</text>
    <rect x="372" y="118" width="120" height="38" rx="12" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="432" y="143" class="t" font-size="15" text-anchor="middle">Survie</text>
    <rect x="498" y="118" width="120" height="38" rx="12" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="558" y="143" class="t" font-size="15" text-anchor="middle">Duel</text>
    <rect x="626" y="118" width="148" height="38" rx="12" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="700" y="143" class="tw" font-size="15" text-anchor="middle">Le meilleur ▲3</text>
  </g>
  <text x="246" y="176" class="note">« Le meilleur ▲3 » : 3 pièces changées ; un clic montre l'avant / après, puis « Appliquer ».</text>
  <!-- cases autour de la poupée -->
  <g font-size="12">
    <!-- colonne gauche -->
    <rect x="252" y="196" width="72" height="72" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="288" y="286" class="s" text-anchor="middle" font-size="13">Arme</text>
    <rect x="302" y="252" width="26" height="18" rx="9" fill="#221A3A"/><text x="315" y="265" class="tp" font-size="12" text-anchor="middle">+7</text>
    <rect x="252" y="296" width="72" height="72" rx="14" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="288" y="386" class="s" text-anchor="middle" font-size="13">Tête</text>
    <circle cx="320" cy="300" r="12" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/><text x="320" y="305" class="tw" font-size="13" text-anchor="middle">▲</text>
    <rect x="252" y="396" width="72" height="72" rx="14" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="288" y="486" class="s" text-anchor="middle" font-size="13">Torse</text>
    <rect x="252" y="496" width="72" height="72" rx="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/><text x="288" y="586" class="s" text-anchor="middle" font-size="13">Jambes</text>
    <rect x="252" y="596" width="72" height="72" rx="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/><text x="288" y="686" class="s" text-anchor="middle" font-size="13">Collier</text>
    <!-- colonne droite -->
    <rect x="696" y="196" width="72" height="72" rx="14" fill="url(#trame)" stroke="#221A3A" stroke-width="3"/><text x="732" y="286" class="s" text-anchor="middle" font-size="13">Arme 2</text>
    <circle cx="764" cy="200" r="12" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/><text x="764" y="205" class="tw" font-size="13" text-anchor="middle">!</text>
    <rect x="696" y="296" width="72" height="72" rx="14" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="732" y="386" class="s" text-anchor="middle" font-size="13">Cape</text>
    <rect x="696" y="396" width="72" height="72" rx="14" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="732" y="486" class="s" text-anchor="middle" font-size="13">Gants</text>
    <rect x="696" y="496" width="72" height="72" rx="14" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="732" y="586" class="s" text-anchor="middle" font-size="13">Bottes</text>
    <rect x="696" y="596" width="72" height="72" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="732" y="686" class="s" text-anchor="middle" font-size="13">Bague</text>
  </g>
  <!-- héros 3D -->
  <ellipse cx="510" cy="620" rx="120" ry="22" fill="#E9DFCB" stroke="#221A3A" stroke-width="3"/>
  <rect x="440" y="230" width="140" height="390" rx="60" fill="#2E2450" opacity="0.85"/>
  <text x="510" y="430" class="sp" text-anchor="middle">héros 3D</text>
  <text x="510" y="450" class="sp" text-anchor="middle">(tourne, zoome)</text>
  <!-- panoplies : pastilles de paliers -->
  <rect x="246" y="706" width="524" height="40" rx="12" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <text x="262" y="732" class="tp b" font-size="15">Tempête</text>
  <g stroke="#221A3A" stroke-width="2"><circle cx="352" cy="726" r="8" fill="#8FD62E"/><circle cx="372" cy="726" r="8" fill="#8FD62E"/><circle cx="392" cy="726" r="8" fill="#8FD62E"/><circle cx="412" cy="726" r="8" fill="#8FD62E"/><circle cx="432" cy="726" r="8" fill="#2E2450"/><circle cx="452" cy="726" r="8" fill="#2E2450"/></g>
  <text x="470" y="732" class="sp">4 / 6 · prochain palier : 6</text>
  <!-- stats : delta au survol -->
  <rect x="246" y="754" width="524" height="40" rx="12" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <text x="262" y="780" class="t" font-size="15">PV <tspan class="b">4 011</tspan> <tspan fill="#4F8F10" class="b">+312</tspan>   Attaque <tspan class="b">905</tspan> <tspan fill="#4F8F10" class="b">+41</tspan>   Défense <tspan class="b">305</tspan> <tspan fill="#C21E45" class="b">−12</tspan>   Détail</text>
  <text x="246" y="822" class="note">Au survol d'une pièce du sac, les stats du héros montrent l'écart (vert / fraise) : on lit le gain sans ouvrir de fiche.</text>

  <!-- sac (puits d'encre) -->
  <rect x="822" y="104" width="760" height="704" rx="18" fill="#221A3A"/>
  <rect x="816" y="98" width="760" height="704" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <text x="842" y="138" class="pop" font-size="22" fill="#221A3A" transform="rotate(-3 842 138)">Sac</text>
  <rect x="930" y="114" width="420" height="38" rx="12" fill="#FFFFFF" stroke="#221A3A" stroke-width="3"/><text x="946" y="139" class="s">Rechercher… (nom, stat, panoplie)</text>
  <rect x="1362" y="114" width="196" height="38" rx="12" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="1376" y="139" class="t" font-size="15">Trier : Pour ma classe</text>
  <!-- filtres en pastilles -->
  <g font-size="14">
    <rect x="836" y="164" width="120" height="32" rx="10" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="896" y="186" class="tw" font-size="14" text-anchor="middle">Ma classe</text>
    <rect x="964" y="164" width="104" height="32" rx="10" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="1016" y="186" class="t" font-size="14" text-anchor="middle">Portables</text>
    <rect x="1076" y="164" width="118" height="32" rx="10" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="1135" y="186" class="t" font-size="14" text-anchor="middle">Nouveautés 4</text>
    <rect x="1202" y="164" width="104" height="32" rx="10" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="1254" y="186" class="t" font-size="14" text-anchor="middle">🔒 Gardées</text>
    <rect x="1314" y="164" width="96" height="32" rx="10" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="1362" y="186" class="t" font-size="14" text-anchor="middle">Inutiles</text>
    <text x="1420" y="186" class="s" font-size="14">58 objets</text>
  </g>
  <rect x="836" y="208" width="724" height="430" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <!-- grille : 8 x 5 -->
  <g stroke="#221A3A" stroke-width="3">
    <rect x="852" y="222" width="72" height="72" rx="14" fill="#FFC928"/><rect x="938" y="222" width="72" height="72" rx="14" fill="#FF8A1F"/>
    <rect x="1024" y="222" width="72" height="72" rx="14" fill="#FF8A1F"/><rect x="1110" y="222" width="72" height="72" rx="14" fill="#B43BEB"/>
    <rect x="1196" y="222" width="72" height="72" rx="14" fill="#B43BEB"/><rect x="1282" y="222" width="72" height="72" rx="14" fill="#22B8F0"/>
    <rect x="1368" y="222" width="72" height="72" rx="14" fill="#22B8F0"/><rect x="1454" y="222" width="72" height="72" rx="14" fill="#8FD62E"/>
    <rect x="852" y="308" width="72" height="72" rx="14" fill="#FF8A1F"/><rect x="938" y="308" width="72" height="72" rx="14" fill="#B43BEB"/>
    <rect x="1024" y="308" width="72" height="72" rx="14" fill="#22B8F0" opacity="0.45"/><rect x="1110" y="308" width="72" height="72" rx="14" fill="#C9BFEA"/>
    <rect x="1196" y="308" width="72" height="72" rx="14" fill="#C9BFEA" opacity="0.5"/><rect x="1282" y="308" width="72" height="72" rx="14" fill="#C9BFEA" opacity="0.5"/>
  </g>
  <!-- badges -->
  <circle cx="918" cy="226" r="12" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/><text x="918" y="231" class="tw" font-size="13" text-anchor="middle">▲</text>
  <rect x="852" y="210" width="44" height="18" rx="9" fill="#FF8A1F" stroke="#221A3A" stroke-width="2" transform="rotate(8 874 219)"/><text x="874" y="223" class="tw" font-size="11" text-anchor="middle">neuf</text>
  <text x="996" y="290" font-size="16">🔒</text>
  <rect x="1024" y="352" width="72" height="22" rx="8" fill="#C21E45"/><text x="1060" y="368" class="tw" font-size="12" text-anchor="middle">Niv. 60</text>
  <text x="1324" y="380" class="sp" font-size="12">gris = plus faible</text>
  <text x="852" y="420" class="sp">▲ pomme : mieux que la pièce portée, pour CETTE classe (note du profil)</text>
  <text x="852" y="442" class="sp">« neuf » mandarine : jamais vue ; 🔒 : gardée (ni démontée ni vendue)</text>
  <text x="852" y="464" class="sp">fond fraise + niveau : pas encore portable (niveau de héros)</text>
  <text x="852" y="486" class="sp">voilée : plus faible partout → proposée par « Inutiles »</text>
  <!-- barre d'actions en masse -->
  <rect x="836" y="650" width="724" height="56" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <text x="852" y="684" class="t">3 choisies</text>
  <rect x="980" y="658" width="190" height="40" rx="12" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/><text x="1075" y="684" class="tw" font-size="15" text-anchor="middle">Démonter · 9 cristaux</text>
  <rect x="1180" y="658" width="150" height="40" rx="12" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="1255" y="684" class="t" font-size="15" text-anchor="middle">🔒 Garder</text>
  <rect x="1340" y="658" width="206" height="40" rx="12" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/><text x="1443" y="684" class="t" font-size="15" text-anchor="middle">Annuler (Ctrl+Z)</text>
  <text x="836" y="730" class="note">Démontage en masse au hub : maintien 0,6 s (anneau), les pièces gardées et portées sont exclues d'office,</text>
  <text x="836" y="746" class="note">le dernier démontage s'annule pendant la séance (les cristaux sont repris).</text>

  <!-- objectif épinglé -->
  <rect x="236" y="846" width="1346" height="44" rx="14" fill="#221A3A"/>
  <rect x="232" y="842" width="1346" height="44" rx="14" fill="#FFE27A" stroke="#221A3A" stroke-width="3"/>
  <text x="250" y="870" class="t"><tspan class="b">★ Objectif</tspan> · Casque du Bouclier antique (niv. 53)   plan ✓   insignes 83 / 140 (≈ 1 Aventure)   niveau 34 / 53   → <tspan class="b">Aventure, époque II</tspan></text>
  <text x="1440" y="870" class="t b">Changer</text>
</svg>
