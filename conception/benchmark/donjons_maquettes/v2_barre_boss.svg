<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Maquette maison BM-DNG (17/10/2026) : HUD d'un combat de boss v2 (barre de boss, incantation, frise des mécaniques,
       alerte à 3 niveaux, télégraphes lisibles, flèche hors écran). DA « autocollant manga » (BIBLE v2). Aucun élément tiers. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; }
      .t2 { fill: #6B5E86; font-size: 15px; }
      .te { fill: #FFF8EC; font-size: 17px; }
      .te2 { fill: #C9BFEA; font-size: 14px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .b { font-weight: 800; }
      .note { fill: #C21E45; font-size: 14px; font-weight: 700; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.18"/></pattern>
    <pattern id="hach" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="14" fill="#FF4D6D" opacity="0.30"/></pattern>
  </defs>

  <!-- arène claire -->
  <rect width="1600" height="900" fill="#CEBFA7"/>
  <ellipse cx="800" cy="520" rx="720" ry="330" fill="#D9CDB6" stroke="#B9A98C" stroke-width="6"/>

  <!-- ===== télégraphes v2 : bord net clair 2 px + encre, remplissage ≤ 35 % qui monte, hachures (lisible sans la couleur) ===== -->
  <g>
    <circle cx="560" cy="430" r="90" fill="url(#hach)"/>
    <circle cx="560" cy="430" r="90" fill="#FF4D6D" opacity="0.12"/>
    <circle cx="560" cy="430" r="58" fill="#FF4D6D" opacity="0.30"/>
    <circle cx="560" cy="430" r="90" fill="none" stroke="#221A3A" stroke-width="5"/>
    <circle cx="560" cy="430" r="90" fill="none" stroke="#FFF8EC" stroke-width="2"/>
    <circle cx="1010" cy="610" r="80" fill="url(#hach)"/>
    <circle cx="1010" cy="610" r="80" fill="#FF4D6D" opacity="0.12"/>
    <circle cx="1010" cy="610" r="22" fill="#FF4D6D" opacity="0.30"/>
    <circle cx="1010" cy="610" r="80" fill="none" stroke="#221A3A" stroke-width="5"/>
    <circle cx="1010" cy="610" r="80" fill="none" stroke="#FFF8EC" stroke-width="2"/>
    <text x="1010" y="616" text-anchor="middle" class="tw" style="font-size:15px">1,2 s</text>
    <!-- zone sûre : pomme, pointillés (forme différente du danger) -->
    <circle cx="1240" cy="420" r="70" fill="#8FD62E" opacity="0.28"/>
    <circle cx="1240" cy="420" r="70" fill="none" stroke="#221A3A" stroke-width="5" stroke-dasharray="14 8"/>
    <circle cx="1240" cy="420" r="70" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 8"/>
    <text x="1240" y="426" text-anchor="middle" class="tw" style="font-size:16px">SÛR</text>
  </g>
  <!-- héros + boss (formes schématiques) -->
  <circle cx="800" cy="520" r="24" fill="#22B8F0" stroke="#221A3A" stroke-width="4"/>
  <ellipse cx="800" cy="548" rx="36" ry="10" fill="none" stroke="#FFC928" stroke-width="4"/>
  <circle cx="760" cy="300" r="56" fill="#B43BEB" stroke="#221A3A" stroke-width="5"/>
  <text x="760" y="306" text-anchor="middle" class="tw" style="font-size:15px">boss</text>
  <!-- incantation au-dessus du boss (dans le monde) -->
  <rect x="680" y="220" width="160" height="16" rx="8" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <rect x="683" y="223" width="104" height="10" rx="5" fill="#FF8A1F"/>

  <!-- ===== barre de boss v2 (haut, compacte, ne cache jamais le boss : la caméra garde le boss sous y = 190) ===== -->
  <rect x="425" y="20" width="760" height="112" rx="16" fill="#221A3A" transform="translate(5 5)"/>
  <rect x="425" y="20" width="760" height="112" rx="16" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <!-- médaillon portrait -->
  <circle cx="470" cy="70" r="38" fill="#B43BEB" stroke="#221A3A" stroke-width="4"/>
  <text x="470" y="76" text-anchor="middle" fill="#FFF" style="font-size:12px">portrait</text>
  <text x="520" y="52" class="t b" style="font-size:21px">Latif, Roi du ciel</text>
  <g transform="rotate(8 760 44)"><rect x="728" y="32" width="78" height="24" rx="10" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/><text x="767" y="50" text-anchor="middle" class="tw" style="font-size:13px">Héroïque</text></g>
  <!-- minuteur de fureur (impatience / rage) -->
  <rect x="1050" y="32" width="120" height="28" rx="12" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
  <text x="1110" y="52" text-anchor="middle" class="tw" style="font-size:15px">Fureur 1:48</text>
  <!-- jauge : creux d'encre, remplissage 2 tons, trace claire des dégâts, encoches des seuils réels des briques -->
  <rect x="520" y="66" width="650" height="30" rx="12" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <rect x="523" y="69" width="430" height="24" rx="10" fill="#FFD6DE"/>
  <rect x="523" y="69" width="380" height="24" rx="10" fill="#FF4D6D"/>
  <rect x="523" y="69" width="380" height="9" rx="5" fill="#FF9DB0"/>
  <line x1="903" y1="69" x2="903" y2="93" stroke="#221A3A" stroke-width="3"/>
  <!-- seuils : 70 % barrière, 35 % barrière, 30 % rage -->
  <g stroke="#221A3A" stroke-width="3">
    <line x1="975" y1="62" x2="975" y2="100"/><line x1="747" y1="62" x2="747" y2="100"/><line x1="715" y1="62" x2="715" y2="100"/>
  </g>
  <circle cx="975" cy="108" r="9" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
  <circle cx="747" cy="108" r="9" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
  <circle cx="715" cy="108" r="9" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
  <text x="845" y="87" text-anchor="middle" class="tw" style="font-size:16px">58 %</text>
  <text x="1060" y="87" text-anchor="middle" class="te2">(PV exacts en infobulle)</text>
  <!-- ligne d'incantation : mécanique active + conseil -->
  <rect x="520" y="104" width="12" height="12" rx="3" fill="none"/>
  <text x="1170" y="124" text-anchor="end" class="t2" style="font-size:14px">seuils : 70 · 35 · 30 %</text>
  <!-- pastilles des mécaniques du boss (survol = conseil), l'active brille -->
  <g>
    <rect x="530" y="140" width="44" height="44" rx="12" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
    <rect x="524" y="134" width="56" height="56" rx="15" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="582" y="140" width="44" height="44" rx="12" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <rect x="634" y="140" width="44" height="44" rx="12" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <rect x="686" y="140" width="44" height="44" rx="12" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
    <rect x="745" y="146" width="330" height="34" rx="12" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
    <rect x="748" y="149" width="200" height="28" rx="10" fill="#FFB566"/>
    <text x="910" y="169" text-anchor="middle" class="tw" style="font-size:16px">Pluie de météores · bouge !</text>
  </g>

  <!-- ===== alerte centrale à 3 niveaux (ici : critique) ===== -->
  <g transform="rotate(-3 800 400)">
    <rect x="610" y="374" width="380" height="54" rx="14" fill="#FF4D6D" stroke="#221A3A" stroke-width="4"/>
    <text x="800" y="411" text-anchor="middle" class="tw pop" style="font-size:26px">Cercle sûr !</text>
  </g>
  <text x="800" y="460" text-anchor="middle" class="t2" style="font-size:13px">mineur : texte seul · moyen : bulle lagon · critique : bulle fraise + son « gong » + vibration interdite</text>

  <!-- ===== frise des mécaniques à venir (droite, verticale, comptes à rebours) ===== -->
  <rect x="1380" y="150" width="200" height="330" rx="16" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <text x="1480" y="178" text-anchor="middle" class="te b" style="font-size:15px">À venir</text>
  <line x1="1418" y1="196" x2="1418" y2="462" stroke="#6B5E86" stroke-width="4"/>
  <g>
    <rect x="1398" y="196" width="40" height="40" rx="10" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
    <text x="1450" y="214" class="te b" style="font-size:15px">Météores</text><text x="1450" y="232" fill="#FF9DB0" style="font-size:14px" font-weight="800">maintenant</text>
    <rect x="1398" y="262" width="40" height="40" rx="10" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <text x="1450" y="280" class="te" style="font-size:15px">Bourrasque</text><text x="1450" y="298" class="te2">dans 6 s</text>
    <rect x="1398" y="328" width="40" height="40" rx="10" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <text x="1450" y="346" class="te" style="font-size:15px">Marque</text><text x="1450" y="364" class="te2">dans 11 s</text>
    <rect x="1398" y="394" width="40" height="40" rx="10" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="1450" y="412" class="te" style="font-size:15px">Barrière</text><text x="1450" y="430" class="te2">à 35 % PV</text>
  </g>
  <text x="1480" y="500" text-anchor="middle" class="t2" style="font-size:13px">option : Paramètres</text>

  <!-- ===== flèche hors écran vers un renfort / totem ===== -->
  <g transform="translate(60 520) rotate(-90)">
    <path d="M0 -26 L22 14 L-22 14 Z" fill="#FFC928" stroke="#221A3A" stroke-width="4"/>
  </g>
  <text x="96" y="526" class="t b" style="font-size:15px">Totem 2/3</text>

  <!-- ===== bas : vie du héros + relève + barre de sorts (cases autocollantes) ===== -->
  <circle cx="470" cy="815" r="62" fill="#221A3A" transform="translate(4 4)"/>
  <circle cx="470" cy="815" r="62" fill="#FF4D6D" stroke="#221A3A" stroke-width="4"/>
  <text x="470" y="812" text-anchor="middle" class="tw pop" style="font-size:30px">6 702</text>
  <text x="470" y="840" text-anchor="middle" class="tw" style="font-size:14px">/ 8 658</text>
  <g transform="rotate(8 548 760)"><rect x="520" y="748" width="64" height="26" rx="10" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="552" y="767" text-anchor="middle" class="tw" style="font-size:13px">Relève 1</text></g>
  <g>
    <rect x="560" y="790" width="490" height="80" rx="16" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <rect x="580" y="802" width="56" height="56" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <rect x="648" y="802" width="56" height="56" rx="14" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
    <rect x="716" y="802" width="56" height="56" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <rect x="784" y="802" width="56" height="56" rx="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
    <rect x="852" y="802" width="56" height="56" rx="14" fill="#E9DFCB" stroke="#221A3A" stroke-width="3"/>
    <rect x="852" y="802" width="56" height="56" rx="14" fill="url(#trame)"/>
    <text x="880" y="837" text-anchor="middle" class="t2" style="font-size:15px">5</text>
    <circle cx="975" cy="830" r="26" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/>
    <text x="975" y="836" text-anchor="middle" class="tw" style="font-size:14px">Esq.</text>
  </g>
  <!-- ligne des dégâts subis (fil court, à gauche) -->
  <rect x="20" y="640" width="300" height="150" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3" opacity="0.92"/>
  <text x="36" y="664" class="te b" style="font-size:14px">Coups reçus</text>
  <text x="36" y="690" fill="#FF9DB0" style="font-size:14px">−1 820 Météore (zone)</text>
  <text x="36" y="712" fill="#FF9DB0" style="font-size:14px">−640 Coup de griffe</text>
  <text x="36" y="734" fill="#C3F07A" style="font-size:14px">+900 Potion</text>
  <text x="36" y="756" class="te2">option : masqué par défaut</text>

  <text x="20" y="890" class="note">Maquette BM-DNG : barre compacte à seuils réels, mécanique active, fureur chronométrée, frise à venir, alerte 3 niveaux, télégraphes hachurés, zone sûre en pointillés.</text>
</svg>
