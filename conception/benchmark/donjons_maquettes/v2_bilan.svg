<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Maquette maison BM-DNG (17/10/2026) : bilan de donjon v2 (victoire à gauche, défaite « Ce qui t'a battu » à droite).
       DA « autocollant manga » (BIBLE v2). Aucun élément tiers. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; }
      .t2 { fill: #6B5E86; font-size: 15px; }
      .te { fill: #FFF8EC; font-size: 17px; }
      .te2 { fill: #C9BFEA; font-size: 14px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .b { font-weight: 800; }
      .note { fill: #C21E45; font-size: 14px; font-weight: 700; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.18"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#CCDEF3"/>
  <rect y="600" width="1600" height="300" fill="#ACB47F"/>

  <!-- ========== VICTOIRE ========== -->
  <g opacity="0.22" fill="#FFFFFF">
    <path d="M410 140 L250 0 L330 0 Z"/><path d="M410 140 L400 0 L470 0 Z"/><path d="M410 140 L560 0 L640 0 Z"/><path d="M410 140 L0 120 L0 190 Z"/><path d="M410 140 L800 110 L800 180 Z"/>
  </g>
  <rect x="45" y="85" width="730" height="760" rx="18" fill="#221A3A"/>
  <rect x="38" y="78" width="730" height="760" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <rect x="41" y="700" width="724" height="135" rx="16" fill="url(#trame)"/>
  <g transform="rotate(-3 400 90)">
    <rect x="200" y="56" width="400" height="70" rx="16" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="400" y="104" text-anchor="middle" class="tw pop" style="font-size:40px">Victoire !</text>
  </g>
  <text x="403" y="160" text-anchor="middle" class="t">Grotte de Latif · Héroïque · Barde</text>
  <!-- étoiles du donjon (objectifs, pas une note) -->
  <g>
    <path d="M300 188 l12 24 l27 4 l-20 18 l5 27 l-24 -13 l-24 13 l5 -27 l-20 -18 l27 -4 z" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <path d="M403 180 l14 28 l31 5 l-23 21 l6 31 l-28 -15 l-28 15 l6 -31 l-23 -21 l31 -5 z" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <path d="M506 188 l12 24 l27 4 l-20 18 l5 27 l-24 -13 l-24 13 l5 -27 l-20 -18 l27 -4 z" fill="#E9DFCB" stroke="#6B5E86" stroke-width="3"/>
  </g>
  <text x="300" y="282" text-anchor="middle" class="t2" style="font-size:13px">Fini</text>
  <text x="403" y="282" text-anchor="middle" class="t2" style="font-size:13px">Sous 6:00</text>
  <text x="506" y="282" text-anchor="middle" class="t2" style="font-size:13px">Sans tomber</text>
  <!-- tuiles en puits d'encre -->
  <g>
    <rect x="70" y="300" width="210" height="84" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <text x="175" y="342" text-anchor="middle" class="te pop" style="font-size:30px">4:12</text>
    <text x="175" y="370" text-anchor="middle" class="te2">temps</text>
    <g transform="rotate(8 262 304)"><rect x="210" y="290" width="98" height="26" rx="10" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="259" y="309" text-anchor="middle" class="tw" style="font-size:13px">Record !</text></g>
    <rect x="298" y="300" width="210" height="84" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <text x="403" y="342" text-anchor="middle" class="te pop" style="font-size:30px">1:58</text>
    <text x="403" y="370" text-anchor="middle" class="te2">boss (record 2:20)</text>
    <rect x="526" y="300" width="210" height="84" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <text x="631" y="342" text-anchor="middle" class="te pop" style="font-size:30px">1</text>
    <text x="631" y="370" text-anchor="middle" class="te2">chute (relevé)</text>
  </g>
  <!-- butin : vraies cases -->
  <text x="70" y="420" class="t b" style="font-size:22px">Butin</text>
  <g>
    <rect x="70" y="434" width="84" height="84" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="112" y="482" text-anchor="middle" class="tw" style="font-size:14px">Tête</text>
    <rect x="100" y="420" width="0" height="0"/>
    <circle cx="146" cy="440" r="13" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text x="146" y="445" text-anchor="middle" class="tw" style="font-size:12px">!</text>
    <rect x="166" y="434" width="84" height="84" rx="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
    <text x="208" y="482" text-anchor="middle" class="tw" style="font-size:14px">Plan</text>
    <rect x="262" y="434" width="84" height="84" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <text x="304" y="482" text-anchor="middle" class="tw" style="font-size:14px">×38</text>
    <rect x="358" y="434" width="84" height="84" rx="14" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/>
    <text x="400" y="482" text-anchor="middle" class="tw" style="font-size:14px">Matières</text>
    <text x="460" y="460" class="t">Tête de Phénix légendaire</text>
    <text x="460" y="484" class="gain" fill="#3E7F0A" style="font-size:15px" font-weight="800">▲ +1 240 de puissance</text>
    <text x="460" y="508" class="t2" style="font-size:14px">Panoplie Phénix 3 / 9</text>
  </g>
  <!-- protection contre la malchance, visible -->
  <rect x="70" y="540" width="666" height="56" rx="14" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/>
  <text x="90" y="574" class="t">Prochaine victoire ici : les <tspan font-weight="800">Gants</tspan> (seul emplacement de Latif qui te manque)</text>
  <!-- ta quête -->
  <rect x="70" y="608" width="666" height="56" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <text x="90" y="642" class="te">Ta quête : panoplie Phénix 3/9 · prochain boss conseillé : Sapo (Bague)</text>
  <!-- boutons -->
  <rect x="75" y="725" width="300" height="64" rx="14" fill="#221A3A"/>
  <rect x="70" y="720" width="300" height="64" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
  <text x="220" y="761" text-anchor="middle" class="tw pop" style="font-size:22px">Rejouer</text>
  <rect x="390" y="720" width="190" height="64" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
  <text x="485" y="759" text-anchor="middle" class="tw" style="font-size:18px">Autre boss</text>
  <rect x="596" y="720" width="140" height="64" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <text x="666" y="759" text-anchor="middle" class="t" style="font-size:18px">Menu</text>

  <!-- ========== DÉFAITE : « Ce qui t'a battu » ========== -->
  <rect x="843" y="85" width="720" height="760" rx="18" fill="#221A3A"/>
  <rect x="836" y="78" width="720" height="760" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <g transform="rotate(-3 1196 90)">
    <rect x="1016" y="56" width="360" height="70" rx="16" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
    <text x="1196" y="104" text-anchor="middle" class="tw pop" style="font-size:36px">Défaite</text>
  </g>
  <text x="1196" y="160" text-anchor="middle" class="t">Latif à 22 % · salle 3 / 3 · 5:40</text>
  <text x="866" y="206" class="t b" style="font-size:22px">Ce qui t'a battu</text>
  <rect x="866" y="220" width="660" height="250" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <g font-size="16">
    <rect x="882" y="234" width="40" height="40" rx="10" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
    <text x="936" y="252" class="te b">Pluie de météores</text><text x="936" y="270" class="te2">zone au sol · 3 impacts</text>
    <text x="1510" y="262" text-anchor="end" fill="#FF9DB0" font-weight="800">−48 % PV</text>
    <rect x="882" y="290" width="40" height="40" rx="10" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
    <text x="936" y="308" class="te b">Coup de griffe</text><text x="936" y="326" class="te2">attaque de base</text>
    <text x="1510" y="318" text-anchor="end" fill="#FF9DB0" font-weight="800">−21 %</text>
    <rect x="882" y="346" width="40" height="40" rx="10" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <text x="936" y="364" class="te b">Marque (figée)</text><text x="936" y="382" class="te2">tu étais dedans</text>
    <text x="1510" y="374" text-anchor="end" fill="#FF9DB0" font-weight="800">−31 % · coup final</text>
    <line x1="882" y1="404" x2="1510" y2="404" stroke="#6B5E86" stroke-width="2"/>
    <text x="882" y="430" class="te2">Les 8 dernières secondes · aucune esquive, 1 potion</text>
    <text x="882" y="454" class="te2">Survol : la ligne complète des coups reçus</text>
  </g>
  <!-- conseil tiré de la brique -->
  <rect x="866" y="486" width="660" height="80" rx="14" fill="#FFEBC8" stroke="#221A3A" stroke-width="3"/>
  <circle cx="900" cy="526" r="20" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="900" y="533" text-anchor="middle" class="tw" style="font-size:20px">!</text>
  <text x="934" y="518" class="t b">La marque se fige après 2 s :</text>
  <text x="934" y="544" class="t">écarte-toi dès qu'elle cesse de te suivre.</text>
  <!-- gardé malgré la défaite -->
  <text x="866" y="606" class="t b" style="font-size:22px">Gardé</text>
  <rect x="866" y="620" width="84" height="84" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
  <text x="908" y="668" text-anchor="middle" class="tw" style="font-size:14px">×12</text>
  <text x="966" y="656" class="t">Cristaux des salles 1 et 2</text>
  <text x="966" y="680" class="t2">Ton meilleur sur Latif : 41 % (aujourd'hui 22 %)</text>
  <rect x="873" y="725" width="320" height="64" rx="14" fill="#221A3A"/>
  <rect x="868" y="720" width="320" height="64" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
  <text x="1028" y="752" text-anchor="middle" class="tw pop" style="font-size:20px">Réessayer le boss</text>
  <text x="1028" y="774" text-anchor="middle" class="tw" style="font-size:13px">depuis la salle 3</text>
  <rect x="1206" y="720" width="190" height="64" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
  <text x="1301" y="759" text-anchor="middle" class="tw" style="font-size:18px">S'entraîner</text>
  <rect x="1410" y="720" width="116" height="64" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <text x="1468" y="759" text-anchor="middle" class="t" style="font-size:18px">Menu</text>

  <text x="38" y="880" class="note">Maquette BM-DNG : temps et records, étoiles d'objectifs, butin en cases, malchance protégée visible, « Ce qui t'a battu » + conseil de la brique, reprise au boss.</text>
</svg>
