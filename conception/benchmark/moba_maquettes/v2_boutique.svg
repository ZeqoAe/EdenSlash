<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Croquis maison BM-MOBA (17/10/2026) : boutique des « Deux Voies » (ouverte à la base ou mort, touche P / Vue).
       Le jeu continue derrière (pas de pause en 4 contre 4) : panneau sur la moitié gauche, la scène reste visible à droite.
       Colonne « Conseillé » d'abord, arbre de recette de l'objet visé, 6 places, annuler le dernier achat tant qu'on est à la base.
       DA « autocollant manga » (BIBLE v2). Aucun élément tiers. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; }
      .t2 { fill: #6B5E86; font-size: 15px; }
      .te { fill: #FFF8EC; font-size: 16px; }
      .te2 { fill: #C9BFEA; font-size: 14px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .b { font-weight: 800; }
      .num { font-weight: 900; font-variant-numeric: tabular-nums; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.22"/></pattern>
  </defs>

  <!-- scène (floutée) -->
  <rect width="1600" height="900" fill="#ACB47F"/>
  <circle cx="1250" cy="470" r="200" fill="#86DDFF" opacity=".45"/>
  <circle cx="1250" cy="470" r="60" fill="#FFFFFF" stroke="#221A3A" stroke-width="3" opacity=".7"/>
  <text x="1250" y="476" text-anchor="middle" class="t b">fontaine</text>
  <circle cx="1180" cy="560" r="24" fill="#FFC928" stroke="#221A3A" stroke-width="4"/>
  <text x="1250" y="720" text-anchor="middle" class="t2">le jeu continue : la scène reste visible</text>

  <!-- panneau papier -->
  <rect x="24" y="24" width="1000" height="852" rx="18" fill="#221A3A"/>
  <rect x="18" y="18" width="1000" height="852" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <rect x="18" y="770" width="1000" height="100" rx="18" fill="url(#trame)" opacity=".6"/>
  <g transform="rotate(-3 160 40)">
    <rect x="40" y="2" width="240" height="56" rx="16" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="160" y="41" text-anchor="middle" class="tw pop" style="font-size:28px">Boutique</text>
  </g>
  <!-- or -->
  <rect x="760" y="34" width="150" height="44" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
  <text x="835" y="65" text-anchor="middle" class="tw num" style="font-size:26px">2 480</text>
  <rect x="920" y="34" width="84" height="44" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <text x="962" y="62" text-anchor="middle" class="t b" style="font-size:15px">✕ (P)</text>

  <!-- onglets -->
  <g transform="translate(40 92)">
    <path d="M0 48 L0 12 Q0 0 12 0 L128 0 Q140 0 140 12 L140 48 Z" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
    <text x="70" y="32" text-anchor="middle" class="tw" style="font-size:16px">Conseillé</text>
    <g fill="#FFEBC8" stroke="#221A3A" stroke-width="3">
      <path d="M150 48 L150 18 Q150 8 160 8 L250 8 Q260 8 260 18 L260 48 Z"/>
      <path d="M270 48 L270 18 Q270 8 280 8 L370 8 Q380 8 380 18 L380 48 Z"/>
      <path d="M390 48 L390 18 Q390 8 400 8 L490 8 Q500 8 500 18 L500 48 Z"/>
      <path d="M510 48 L510 18 Q510 8 520 8 L610 8 Q620 8 620 18 L620 48 Z"/>
      <path d="M630 48 L630 18 Q630 8 640 8 L730 8 Q740 8 740 18 L740 48 Z"/>
      <path d="M750 48 L750 18 Q750 8 760 8 L850 8 Q860 8 860 18 L860 48 Z"/>
    </g>
    <g class="t b" style="font-size:14px" text-anchor="middle">
      <text x="205" y="35">Attaque</text><text x="325" y="35">Magie</text><text x="445" y="35">Défense</text>
      <text x="565" y="35">Soutien</text><text x="685" y="35">Bottes</text><text x="805" y="35">Potions</text>
    </g>
    <text x="900" y="35" class="t2" style="font-size:13px">LB / RB</text>
  </g>

  <!-- puits : parcours conseillé (Arcane, « Marée ») -->
  <rect x="40" y="140" width="600" height="300" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <text x="60" y="172" class="te b">Ton parcours · Arcane « Marée »</text>
  <text x="620" y="172" text-anchor="end" class="te2">pour Magicien</text>
  <g transform="translate(60 192)">
    <!-- 1 acheté, 2 en cours, 3-4 à venir -->
    <rect width="96" height="96" rx="14" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/>
    <text x="48" y="54" text-anchor="middle" class="tw" style="font-size:13px">Bottes</text>
    <circle cx="86" cy="10" r="14" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/><text x="86" y="16" text-anchor="middle" class="tw" style="font-size:14px">✓</text>
    <text x="110" y="54" fill="#FFF8EC" font-size="26">→</text>
    <g transform="translate(140 0)">
      <rect x="-4" y="-4" width="104" height="104" rx="16" fill="none" stroke="#FFFFFF" stroke-width="6"/>
      <rect x="-4" y="-4" width="104" height="104" rx="16" fill="none" stroke="#0B7DB5" stroke-width="3"/>
      <rect width="96" height="96" rx="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
      <text x="48" y="46" text-anchor="middle" class="tw" style="font-size:13px">Orbe des</text>
      <text x="48" y="64" text-anchor="middle" class="tw" style="font-size:13px">marées</text>
      <rect x="10" y="100" width="76" height="22" rx="8" fill="#FFC928" stroke="#221A3A" stroke-width="2"/>
      <text x="48" y="116" text-anchor="middle" class="t num" style="font-size:13px">2 300</text>
    </g>
    <text x="250" y="54" fill="#FFF8EC" font-size="26">→</text>
    <g transform="translate(280 0)"><rect width="96" height="96" rx="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3" opacity=".55"/>
      <text x="48" y="46" text-anchor="middle" class="tw" style="font-size:13px">Bâton de</text><text x="48" y="64" text-anchor="middle" class="tw" style="font-size:13px">l'éclipse</text></g>
    <text x="390" y="54" fill="#FFF8EC" font-size="26">→</text>
    <g transform="translate(420 0)"><rect width="96" height="96" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3" opacity=".55"/>
      <text x="48" y="46" text-anchor="middle" class="tw" style="font-size:13px">Sceptre</text><text x="48" y="64" text-anchor="middle" class="tw" style="font-size:13px">du givre</text></g>
  </g>
  <text x="60" y="350" class="te2">Contre leur équipe (2 Ombre) : le Sceptre du givre passe avant le Bâton.</text>
  <rect x="60" y="370" width="300" height="52" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
  <text x="210" y="403" text-anchor="middle" class="tw pop" style="font-size:19px">Acheter · 2 300</text>
  <rect x="374" y="370" width="246" height="52" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <text x="497" y="402" text-anchor="middle" class="t b" style="font-size:15px">Achat auto : oui</text>

  <!-- fiche de l'objet visé + recette -->
  <rect x="660" y="140" width="344" height="610" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
  <rect x="680" y="160" width="76" height="76" rx="14" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
  <text x="772" y="186" class="b" fill="#7A1DB0" style="font-size:20px">Orbe des marées</text>
  <text x="772" y="210" class="t2" style="font-size:14px">Magie · objet fini</text>
  <text x="772" y="232" class="t num" style="font-size:15px">2 300 or (reste 1 400)</text>
  <text x="680" y="270" class="t" style="font-size:16px">+ magie (forte)</text>
  <text x="680" y="294" class="t" style="font-size:16px">+ recharges (moyen)</text>
  <text x="680" y="326" class="t b" style="font-size:16px">Marée : un sort qui touche un</text>
  <text x="680" y="348" class="t b" style="font-size:16px">héros te protège un instant.</text>
  <text x="680" y="372" class="t2" style="font-size:13px">(détail chiffré : survol ou X)</text>
  <!-- recette -->
  <text x="680" y="410" class="t b" style="font-size:15px">Recette</text>
  <rect x="790" y="424" width="64" height="64" rx="12" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
  <line x1="822" y1="488" x2="742" y2="526" stroke="#221A3A" stroke-width="3"/>
  <line x1="822" y1="488" x2="902" y2="526" stroke="#221A3A" stroke-width="3"/>
  <rect x="710" y="526" width="64" height="64" rx="12" fill="#DC92FF" stroke="#221A3A" stroke-width="3"/>
  <circle cx="764" cy="530" r="12" fill="#8FD62E" stroke="#221A3A" stroke-width="2"/><text x="764" y="535" text-anchor="middle" class="tw" style="font-size:11px">✓</text>
  <text x="742" y="610" text-anchor="middle" class="t2" style="font-size:12px">Grimoire usé</text>
  <rect x="870" y="526" width="64" height="64" rx="12" fill="#86DDFF" stroke="#221A3A" stroke-width="3"/>
  <text x="902" y="610" text-anchor="middle" class="t2" style="font-size:12px">Sablier fêlé · 500</text>
  <text x="680" y="650" class="t2" style="font-size:13px">Le Grimoire que tu portes compte :</text>
  <text x="680" y="670" class="t2" style="font-size:13px">tu ne paies que la différence.</text>
  <text x="680" y="720" class="t b" style="font-size:14px">Mène à : Sablier du sage · Lanterne</text>

  <!-- grille de l'onglet (aperçu des composants) -->
  <rect x="40" y="456" width="600" height="294" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <text x="60" y="486" class="te b">Composants</text>
  <g transform="translate(60 500)" stroke="#221A3A" stroke-width="3">
    <rect width="64" height="64" rx="12" fill="#FF8A1F"/><rect x="78" width="64" height="64" rx="12" fill="#DC92FF"/>
    <rect x="156" width="64" height="64" rx="12" fill="#FFE27A"/><rect x="234" width="64" height="64" rx="12" fill="#FF9DB0"/>
    <rect x="312" width="64" height="64" rx="12" fill="#C3F07A"/>
    <rect y="96" width="64" height="64" rx="12" fill="#FFB566"/><rect x="78" y="96" width="64" height="64" rx="12" fill="#86DDFF"/>
    <rect x="156" y="96" width="64" height="64" rx="12" fill="#C3F07A"/><rect x="234" y="96" width="64" height="64" rx="12" fill="#FF9DB0"/>
    <rect x="312" y="96" width="64" height="64" rx="12" fill="#86DDFF"/>
  </g>
  <g class="te2" style="font-size:12px" text-anchor="middle">
    <text x="92" y="584">350</text><text x="170" y="584">350</text><text x="248" y="584">400</text><text x="326" y="584">400</text><text x="404" y="584">300</text>
    <text x="92" y="680">450</text><text x="170" y="680">500</text><text x="248" y="680">450</text><text x="326" y="680">550</text><text x="404" y="680">500</text>
  </g>
  <rect x="226" y="596" width="64" height="64" rx="12" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <text x="460" y="540" class="te2" style="font-size:13px">Une case grise =</text>
  <text x="460" y="558" class="te2" style="font-size:13px">pas assez d'or</text>
  <text x="460" y="590" class="te2" style="font-size:13px">Survol : à quoi</text>
  <text x="460" y="608" class="te2" style="font-size:13px">il mène</text>

  <!-- tes 6 places + annuler -->
  <g transform="translate(40 776)">
    <text x="0" y="22" class="t b">Tes objets</text>
    <g transform="translate(110 0)" stroke="#221A3A" stroke-width="3">
      <rect width="58" height="58" rx="12" fill="#8FD62E"/><rect x="68" width="58" height="58" rx="12" fill="#DC92FF"/>
      <rect x="136" width="58" height="58" rx="12" fill="#FFEBC8"/><rect x="204" width="58" height="58" rx="12" fill="#FFEBC8"/>
      <rect x="272" width="58" height="58" rx="12" fill="#FFEBC8"/><rect x="340" width="58" height="58" rx="12" fill="#FFEBC8"/>
    </g>
    <g fill="url(#trame)"><rect x="246" width="58" height="58" rx="12"/><rect x="314" width="58" height="58" rx="12"/><rect x="382" width="58" height="58" rx="12"/><rect x="450" width="58" height="58" rx="12"/></g>
    <rect x="540" y="6" width="200" height="46" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <text x="640" y="35" text-anchor="middle" class="t b" style="font-size:15px">↶ Annuler l'achat</text>
    <rect x="752" y="6" width="200" height="46" rx="14" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/>
    <text x="852" y="35" text-anchor="middle" class="tw" style="font-size:15px">Vendre (maintenir)</text>
  </g>
</svg>
