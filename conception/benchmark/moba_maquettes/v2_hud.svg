<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'M PLUS Rounded 1c', 'Nunito', sans-serif">
  <!-- Croquis maison BM-MOBA (17/10/2026) : HUD en partie des « Deux Voies » à 1600×900. Tableau du haut, mini-carte avec brouillard,
       cadres des alliés avec leur intention, carte de héros et 4 cases (enchaînements en plots, ultime verrouillé au niveau 5),
       or et objet conseillé, roue de repères ouverte, choix de niveau non bloquant, annonce d'objectif.
       DA « autocollant manga » (BIBLE v2). Aucun élément tiers. -->
  <defs>
    <style>
      .t { fill: #221A3A; font-size: 17px; }
      .t2 { fill: #6B5E86; font-size: 15px; }
      .te { fill: #FFF8EC; font-size: 16px; }
      .te2 { fill: #C9BFEA; font-size: 14px; }
      .tw { fill: #FFFFFF; stroke: #221A3A; stroke-width: 4; paint-order: stroke; font-weight: 800; }
      .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; }
      .b { font-weight: 800; }
      .num { font-weight: 900; font-variant-numeric: tabular-nums; }
    </style>
    <pattern id="trame" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#221A3A" opacity="0.22"/></pattern>
    <pattern id="brume" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#FFF8EC" opacity="0.35"/></pattern>
  </defs>

  <!-- ===== le monde (schéma) : voie, vagues, tour, héros ===== -->
  <rect width="1600" height="900" fill="#ACB47F"/>
  <path d="M-20 560 C 300 470, 700 520, 1000 420 S 1500 300, 1640 260" fill="none" stroke="#CEBFA7" stroke-width="190" stroke-linecap="round"/>
  <!-- tour ennemie + portée (s'affiche quand on approche) -->
  <circle cx="1240" cy="330" r="150" fill="#FF4D6D" opacity=".10"/>
  <circle cx="1240" cy="330" r="150" fill="none" stroke="#221A3A" stroke-width="4" stroke-dasharray="16 10"/>
  <circle cx="1240" cy="330" r="150" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="16 10"/>
  <rect x="1212" y="270" width="56" height="74" rx="12" fill="#FF4D6D" stroke="#221A3A" stroke-width="4"/>
  <rect x="1200" y="246" width="80" height="14" rx="7" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
  <rect x="1203" y="249" width="52" height="8" rx="4" fill="#FF4D6D"/>
  <!-- sbires : pastilles rondes (alliés lagon, ennemis fraise), bélier carré -->
  <g stroke="#221A3A" stroke-width="3">
    <circle cx="820" cy="470" r="13" fill="#22B8F0"/><circle cx="850" cy="455" r="13" fill="#22B8F0"/><circle cx="845" cy="490" r="13" fill="#22B8F0"/>
    <circle cx="800" cy="500" r="11" fill="#86DDFF"/><circle cx="785" cy="460" r="11" fill="#86DDFF"/>
    <rect x="752" y="472" width="26" height="26" rx="6" fill="#22B8F0"/>
    <circle cx="940" cy="430" r="13" fill="#FF4D6D"/><circle cx="965" cy="455" r="13" fill="#FF4D6D"/><circle cx="975" cy="418" r="13" fill="#FF4D6D"/>
    <circle cx="1000" cy="440" r="11" fill="#FF9DB0"/><circle cx="1010" cy="410" r="11" fill="#FF9DB0"/>
  </g>
  <!-- le héros du joueur + allié + ennemi -->
  <circle cx="700" cy="530" r="24" fill="#22B8F0" stroke="#221A3A" stroke-width="4"/>
  <ellipse cx="700" cy="558" rx="34" ry="9" fill="none" stroke="#FFC928" stroke-width="4"/>
  <circle cx="640" cy="490" r="22" fill="#22B8F0" stroke="#221A3A" stroke-width="4"/>
  <g transform="translate(590 446)"><rect width="104" height="22" rx="8" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/><rect x="4" y="13" width="70" height="5" rx="2" fill="#8FD62E"/><text x="52" y="11" text-anchor="middle" class="t b" style="font-size:10px">Clerc · 6</text></g>
  <circle cx="1080" cy="400" r="24" fill="#FF4D6D" stroke="#221A3A" stroke-width="4"/>
  <g transform="translate(1026 352)"><rect width="110" height="24" rx="8" fill="#FFF8EC" stroke="#C21E45" stroke-width="3"/><rect x="4" y="14" width="44" height="6" rx="3" fill="#FF4D6D"/><text x="55" y="12" text-anchor="middle" class="t b" style="font-size:11px">Chasseur · 7 ▲</text></g>
  <!-- repère « Attaquez ! » posé par le joueur sur l'ennemi -->
  <g transform="translate(1080 330)"><circle r="18" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/><text y="7" text-anchor="middle" class="tw" style="font-size:18px">!</text></g>

  <!-- ===== haut centre : tableau de la partie ===== -->
  <g transform="translate(470 14)">
    <rect x="0" y="0" width="660" height="78" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="6" y="6" width="660" height="78" rx="18" fill="#221A3A" opacity=".0"/>
    <!-- portraits bleus -->
    <g stroke="#221A3A" stroke-width="3">
      <circle cx="40" cy="39" r="22" fill="#FFC928"/><circle cx="92" cy="39" r="22" fill="#86DDFF"/>
      <circle cx="144" cy="39" r="22" fill="#8FD62E"/><circle cx="196" cy="39" r="22" fill="#FF8A1F"/>
      <circle cx="464" cy="39" r="22" fill="#B43BEB"/><circle cx="516" cy="39" r="22" fill="#9A93AE"/>
      <circle cx="568" cy="39" r="22" fill="#FFC928"/><circle cx="620" cy="39" r="22" fill="#86DDFF"/>
    </g>
    <circle cx="516" cy="39" r="22" fill="url(#trame)"/>
    <text x="516" y="46" text-anchor="middle" class="tw num" style="font-size:18px">14</text>
    <!-- score + temps -->
    <rect x="232" y="10" width="196" height="58" rx="14" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <text x="270" y="50" text-anchor="middle" class="num" fill="#86DDFF" style="font-size:30px">7</text>
    <text x="390" y="50" text-anchor="middle" class="num" fill="#FF9DB0" style="font-size:30px">5</text>
    <text x="330" y="36" text-anchor="middle" class="te num" style="font-size:20px">12:34</text>
    <text x="330" y="58" text-anchor="middle" class="te2" style="font-size:12px">tours 4 – 3</text>
  </g>
  <!-- minuteurs d'objectifs -->
  <g transform="translate(602 100)">
    <rect width="186" height="34" rx="12" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
    <text x="93" y="23" text-anchor="middle" class="tw" style="font-size:15px">Gardien · 0:45</text>
    <rect x="200" y="0" width="186" height="34" rx="12" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
    <text x="293" y="23" text-anchor="middle" class="tw" style="font-size:15px">Colosse · en vie</text>
  </g>

  <!-- annonce (une seule bulle à la fois) -->
  <g transform="translate(600 160)">
    <rect width="400" height="46" rx="16" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <polygon points="190,46 210,46 200,60" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <rect x="186" y="42" width="28" height="6" fill="#22B8F0"/>
    <text x="200" y="30" text-anchor="middle" class="tw" style="font-size:18px">Le Gardien arrive dans 45 s</text>
  </g>

  <!-- ===== haut droit : mini-carte (brouillard hors de la vue des alliés) ===== -->
  <g transform="translate(1292 14)">
    <rect width="294" height="190" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="10" y="10" width="274" height="170" rx="12" fill="#ACB47F" stroke="#221A3A" stroke-width="2"/>
    <polyline points="40,95 60,40 234,40 254,95" fill="none" stroke="#CEBFA7" stroke-width="12" stroke-linecap="round"/>
    <polyline points="40,95 60,150 234,150 254,95" fill="none" stroke="#CEBFA7" stroke-width="12" stroke-linecap="round"/>
    <path d="M147 30 C 140 70, 154 110, 147 160" stroke="#86DDFF" stroke-width="8" fill="none"/>
    <!-- brouillard : moitié rouge non vue -->
    <rect x="170" y="10" width="114" height="170" rx="12" fill="#2E2450" opacity=".35"/>
    <rect x="170" y="10" width="114" height="170" fill="url(#brume)"/>
    <!-- cadre de la vue de la caméra -->
    <rect x="186" y="28" width="56" height="34" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <g stroke="#221A3A" stroke-width="2">
      <circle cx="200" cy="44" r="7" fill="#FFC928"/><circle cx="192" cy="50" r="6" fill="#22B8F0"/>
      <circle cx="96" cy="150" r="6" fill="#22B8F0"/><circle cx="150" cy="100" r="6" fill="#22B8F0"/>
      <circle cx="228" cy="42" r="6" fill="#FF4D6D"/>
      <rect x="22" y="88" width="12" height="14" fill="#22B8F0"/><rect x="260" y="88" width="12" height="14" fill="#FF4D6D"/>
    </g>
    <text x="147" y="105" text-anchor="middle" class="tw" style="font-size:12px">?</text>
  </g>
  <!-- fil des éliminations -->
  <g transform="translate(1316 214)">
    <rect width="270" height="30" rx="10" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <rect x="8" y="7" width="16" height="16" rx="4" fill="#FFC928" stroke="#221A3A" stroke-width="2"/>
    <text x="34" y="21" class="te" style="font-size:13px">Toi ⚔ Mage rouge · +300</text>
    <rect y="36" width="270" height="30" rx="10" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <text x="14" y="57" class="te" style="font-size:13px">Tour T1 rouge (Soleil) tombée · +150</text>
  </g>

  <!-- ===== gauche : alliés (intention lisible) ===== -->
  <g transform="translate(16 250)">
    <g>
      <rect width="230" height="62" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
      <circle cx="32" cy="31" r="20" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/>
      <text x="62" y="24" class="t b" style="font-size:14px">Clerc · 6</text>
      <rect x="62" y="32" width="150" height="10" rx="5" fill="#2E2450"/><rect x="62" y="32" width="120" height="10" rx="5" fill="#8FD62E"/>
      <text x="62" y="56" class="t2" style="font-size:12px">avec toi · ultime prêt ●</text>
    </g>
    <g transform="translate(0 72)">
      <rect width="230" height="62" rx="14" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
      <circle cx="32" cy="31" r="20" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
      <text x="62" y="24" class="t b" style="font-size:14px">Ninja · 7</text>
      <rect x="62" y="32" width="150" height="10" rx="5" fill="#2E2450"/><rect x="62" y="32" width="70" height="10" rx="5" fill="#FFC928"/>
      <text x="62" y="56" class="t2" style="font-size:12px">va au Gardien</text>
    </g>
    <g transform="translate(0 144)">
      <rect width="230" height="62" rx="14" fill="#E9DFCB" stroke="#221A3A" stroke-width="3"/>
      <rect width="230" height="62" rx="14" fill="url(#trame)"/>
      <circle cx="32" cy="31" r="20" fill="#9A93AE" stroke="#221A3A" stroke-width="3"/>
      <text x="32" y="37" text-anchor="middle" class="tw num" style="font-size:16px">9</text>
      <text x="62" y="24" class="t b" style="font-size:14px">Chevalier · 6</text>
      <text x="62" y="48" class="t2" style="font-size:12px">tombé · revient dans 9 s</text>
    </g>
  </g>

  <!-- ===== choix de niveau, non bloquant (au-dessus des cases) ===== -->
  <g transform="translate(540 650)">
    <rect width="520" height="44" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="20" y="29" class="tw pop" style="font-size:17px">Niveau 4 !</text>
    <text x="130" y="29" class="t b" style="font-size:15px">Un enchaînement : Ctrl+1 · Ctrl+2 · Ctrl+3</text>
  </g>

  <!-- ===== bas centre : carte du héros + 4 cases ===== -->
  <g transform="translate(470 704)">
    <rect width="660" height="180" rx="20" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="0" y="140" width="660" height="40" rx="20" fill="url(#trame)"/>
    <!-- portrait + anneau d'expérience + niveau -->
    <circle cx="70" cy="80" r="50" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <circle cx="70" cy="80" r="44" fill="none" stroke="#8FD62E" stroke-width="7" stroke-dasharray="190 300" transform="rotate(-90 70 80)"/>
    <circle cx="70" cy="80" r="34" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <circle cx="108" cy="122" r="17" fill="#221A3A"/><text x="108" y="128" text-anchor="middle" class="te num" style="font-size:16px">4</text>
    <!-- PV -->
    <rect x="136" y="18" width="500" height="26" rx="12" fill="#2E2450" stroke="#221A3A" stroke-width="3"/>
    <rect x="139" y="21" width="380" height="20" rx="10" fill="#FF4D6D"/>
    <rect x="139" y="21" width="380" height="7" rx="3" fill="#FF9DB0"/>
    <rect x="519" y="21" width="40" height="20" fill="#FFFFFF" opacity=".8"/>
    <text x="386" y="37" text-anchor="middle" class="tw num" style="font-size:15px">1 840 / 2 420</text>
    <!-- 4 cases -->
    <g transform="translate(140 56)">
      <g><rect width="82" height="82" rx="14" fill="#FFC928" stroke="#221A3A" stroke-width="3"/><text x="41" y="50" text-anchor="middle" class="tw" style="font-size:14px">sort 1</text>
        <circle cx="30" cy="92" r="5" fill="#8FD62E" stroke="#221A3A" stroke-width="2"/><circle cx="52" cy="92" r="5" fill="#E9DFCB" stroke="#221A3A" stroke-width="2"/>
        <rect x="-6" y="-8" width="24" height="22" rx="6" fill="#FFF8EC" stroke="#221A3A" stroke-width="2"/><text x="6" y="8" text-anchor="middle" class="t b" style="font-size:12px">A</text></g>
      <g transform="translate(96 0)"><rect width="82" height="82" rx="14" fill="#FF8A1F" stroke="#221A3A" stroke-width="3"/>
        <path d="M41 41 L41 0 A41 41 0 0 1 82 41 Z" fill="#221A3A" opacity=".55"/>
        <text x="41" y="52" text-anchor="middle" class="tw num" style="font-size:22px">3</text>
        <circle cx="30" cy="92" r="5" fill="#8FD62E" stroke="#221A3A" stroke-width="2"/><circle cx="52" cy="92" r="5" fill="#E9DFCB" stroke="#221A3A" stroke-width="2"/>
        <rect x="-6" y="-8" width="24" height="22" rx="6" fill="#FFF8EC" stroke="#221A3A" stroke-width="2"/><text x="6" y="8" text-anchor="middle" class="t b" style="font-size:12px">E</text></g>
      <g transform="translate(192 0)"><rect width="82" height="82" rx="14" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/><text x="41" y="50" text-anchor="middle" class="tw" style="font-size:14px">sort 3</text>
        <circle cx="30" cy="92" r="5" fill="#E9DFCB" stroke="#221A3A" stroke-width="2"/><circle cx="52" cy="92" r="5" fill="#E9DFCB" stroke="#221A3A" stroke-width="2"/>
        <rect x="-6" y="-8" width="24" height="22" rx="6" fill="#FFF8EC" stroke="#221A3A" stroke-width="2"/><text x="6" y="8" text-anchor="middle" class="t b" style="font-size:12px">R</text></g>
      <!-- ultime verrouillé -->
      <g transform="translate(288 0)"><rect width="82" height="82" rx="14" fill="#E9DFCB" stroke="#221A3A" stroke-width="3"/><rect width="82" height="82" rx="14" fill="url(#trame)"/>
        <rect x="-3" y="-3" width="88" height="88" rx="16" fill="none" stroke="#FFC928" stroke-width="3"/>
        <path d="M31 34 L31 26 A10 10 0 0 1 51 26 L51 34" fill="none" stroke="#221A3A" stroke-width="4"/>
        <rect x="27" y="33" width="28" height="20" rx="5" fill="#6B5E86" stroke="#221A3A" stroke-width="3"/>
        <text x="41" y="70" text-anchor="middle" class="t b" style="font-size:12px">niv. 5</text>
        <rect x="-6" y="-8" width="24" height="22" rx="6" fill="#FFF8EC" stroke="#221A3A" stroke-width="2"/><text x="6" y="8" text-anchor="middle" class="t b" style="font-size:12px">T</text></g>
      <!-- esquive, rappel, potion -->
      <g transform="translate(386 10)">
        <rect width="58" height="58" rx="12" fill="#8FD62E" stroke="#221A3A" stroke-width="3"/><text x="29" y="36" text-anchor="middle" class="tw" style="font-size:12px">esquive</text>
        <rect x="-5" y="-8" width="30" height="20" rx="6" fill="#FFF8EC" stroke="#221A3A" stroke-width="2"/><text x="10" y="7" text-anchor="middle" class="t b" style="font-size:10px">Maj</text>
      </g>
    </g>
  </g>

  <!-- ===== bas droite : or + objet conseillé + boutique ===== -->
  <g transform="translate(1150 740)">
    <rect width="300" height="140" rx="18" fill="#FFF8EC" stroke="#221A3A" stroke-width="3"/>
    <rect x="16" y="14" width="140" height="40" rx="12" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text x="86" y="42" text-anchor="middle" class="tw num" style="font-size:24px">1 240</text>
    <rect x="168" y="14" width="116" height="40" rx="12" fill="#22B8F0" stroke="#221A3A" stroke-width="3"/>
    <text x="226" y="40" text-anchor="middle" class="tw" style="font-size:16px">Boutique · P</text>
    <rect x="16" y="66" width="56" height="56" rx="12" fill="#B43BEB" stroke="#221A3A" stroke-width="3"/>
    <text x="84" y="86" class="t b" style="font-size:14px">Prochain : Orbe des marées</text>
    <rect x="84" y="96" width="200" height="12" rx="6" fill="#2E2450"/><rect x="84" y="96" width="108" height="12" rx="6" fill="#FFC928"/>
    <text x="84" y="124" class="t2" style="font-size:12px">1 240 / 2 300 · [P] à la base</text>
  </g>
  <!-- rappel + potion à gauche des cases -->
  <g transform="translate(330 790)">
    <rect width="58" height="58" rx="12" fill="#86DDFF" stroke="#221A3A" stroke-width="3"/><text x="29" y="35" text-anchor="middle" class="tw" style="font-size:12px">rappel</text>
    <rect x="-5" y="-8" width="22" height="20" rx="6" fill="#FFF8EC" stroke="#221A3A" stroke-width="2"/><text x="6" y="7" text-anchor="middle" class="t b" style="font-size:11px">X</text>
    <rect x="70" width="58" height="58" rx="12" fill="#FF4D6D" stroke="#221A3A" stroke-width="3"/><text x="99" y="35" text-anchor="middle" class="tw" style="font-size:12px">soin ×2</text>
    <rect x="65" y="-8" width="22" height="20" rx="6" fill="#FFF8EC" stroke="#221A3A" stroke-width="2"/><text x="76" y="7" text-anchor="middle" class="t b" style="font-size:11px">C</text>
  </g>

  <!-- ===== roue de repères (molette / L3 maintenu) ===== -->
  <g transform="translate(150 640)">
    <circle r="112" fill="#2E2450" opacity=".88" stroke="#221A3A" stroke-width="4"/>
    <circle r="36" fill="#FFC928" stroke="#221A3A" stroke-width="3"/>
    <text y="6" text-anchor="middle" class="tw" style="font-size:12px">Objectif</text>
    <g stroke="#221A3A" stroke-width="3">
      <circle cx="0" cy="-74" r="28" fill="#FF8A1F"/><circle cx="74" cy="0" r="28" fill="#22B8F0"/>
      <circle cx="0" cy="74" r="28" fill="#FF4D6D"/><circle cx="-74" cy="0" r="28" fill="#8FD62E"/>
    </g>
    <text x="0" y="-70" text-anchor="middle" class="tw" style="font-size:11px">Attaquez</text>
    <text x="74" y="4" text-anchor="middle" class="tw" style="font-size:11px">J'y vais</text>
    <text x="0" y="78" text-anchor="middle" class="tw" style="font-size:11px">Repli !</text>
    <text x="-74" y="4" text-anchor="middle" class="tw" style="font-size:11px">À moi !</text>
    <text x="0" y="-122" text-anchor="middle" class="t b" style="font-size:13px">Les alliés obéissent</text>
  </g>

  <text x="1590" y="894" text-anchor="end" fill="#221A3A" font-size="12">croquis · pas une capture</text>
</svg>
