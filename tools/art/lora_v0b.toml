# LoRA de style eden_style_v0b : DA colorée du jeu (héros, monstres, icônes), demandée par le joueur le 17/10 (voir conception/art/lora/R_LORA.md).
# Lancer : C:\AI\venv_train\Scripts\python.exe tools/art/train_lora.py tools/art/lora_v0b.toml

[modele]
# SDXL base 1.0 (stabilityai, CreativeML Open RAIL++-M, accès libre)
base = "C:/AI/ComfyUI/models/checkpoints/sd_xl_base_1.0.safetensors"

[donnees]
# fait par tools/art/lora_dataset.py d'après conception/art/lora/dataset_v0b.json (60 images)
images = "C:/AI/lora_data/eden_style_v0b/img"
resolution = 1024
batch = 1
repetitions = 1
bucket_no_upscale = true
keep_tokens = 1

[reseau]
rang = 32
alpha = 16
unet_seulement = true   # encodeurs de texte figés (sorties mises en cache) : moins de VRAM

[entrainement]
pas = 2000
sauver_tous_les = 500
lr = 1e-4
optimiseur = "AdamW8bit"
planning = "cosine"
echauffement = 100
precision = "bf16"
precision_sauvegarde = "bf16"
min_snr_gamma = 5
graine = 42
fp8_base = false        # true : modèle de base en fp8 si la VRAM manque (≈ -2,5 Go)

[sortie]
dossier = "C:/AI/lora_out/eden_style_v0b"
nom = "eden_style_v0b"
